<div class="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-6 z-50 overflow-hidden font-['Nunito',sans-serif] selection:bg-[#4141a5] selection:text-white">
  <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg p-5 sm:p-8 border border-gray-100 relative flex flex-col max-h-[95vh]">
    
    <a routerLink="/listarmedicamentos" class="absolute top-5 right-5 text-gray-400 hover:text-gray-700 font-bold text-lg p-1 z-10">✕</a>

    <h2 class="text-xl sm:text-2xl font-extrabold text-[#170B3D] mb-4 uppercase tracking-wider pr-8 shrink-0">
      Formulario Medicamentos
    </h2>

    <form class="space-y-3 sm:space-y-4 overflow-y-auto flex-1 pr-1 py-1">
      <div>
        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Nombre del Medicamento</label>
        <input type="text" placeholder="Ej: Traumeel ad us. vet." class="w-full border border-gray-200 rounded-xl px-4 py-2.5 sm:py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#4141a5]/30 focus:border-[#4141a5] bg-gray-50/50" />
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Tipo de Medicamento</label>
        <input type="text" placeholder="Ej: Antibiótico, Analgésico..." class="w-full border border-gray-200 rounded-xl px-4 py-2.5 sm:py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#4141a5]/30 focus:border-[#4141a5] bg-gray-50/50" />
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Descripción</label>
        <textarea placeholder="Indicaciones y uso..." rows="3" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 sm:py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#4141a5]/30 focus:border-[#4141a5] bg-gray-50/50 resize-none leading-relaxed"></textarea>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Cantidad (ML / MG)</label>
          <input type="text" placeholder="Ej: 30mg" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 sm:py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#4141a5]/30 focus:border-[#4141a5] bg-gray-50/50" />
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Estado</label>
          <select class="w-full border border-gray-200 rounded-xl px-4 py-2.5 sm:py-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#4141a5]/30 focus:border-[#4141a5] bg-gray-50/50 cursor-pointer">
            <option value="disponible">Disponible</option>
            <option value="agotado">Agotado</option>
          </select>
        </div>
      </div>

      <div class="flex items-center justify-end gap-3 mt-4 pt-3 sm:pt-4 border-t border-gray-100 shrink-0">
        <a routerLink="/listarmedicamentos" class="px-4 sm:px-5 py-2.5 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold transition text-xs uppercase tracking-wider text-center cursor-pointer">
          Cancelar
        </a>
        <button type="button" class="px-5 sm:px-6 py-2.5 rounded-xl bg-[#4141a5] hover:bg-[#33338b] text-white font-bold transition text-xs uppercase tracking-wider shadow-md active:scale-95 cursor-pointer">
          Guardar
        </button>
      </div>
    </form>
  </div>
</div>
