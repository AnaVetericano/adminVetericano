@switch (tipo()) {
  @case ('perro') {
    <svg class="ico dog" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
      <g class="head">
        <g class="part ear-l"><path d="M21 21C13 18 8 27 10.5 36c.8 2.8 4.8 2.4 6.6-.6 1.6-2.7 2.6-7 3.4-10.8" /></g>
        <g class="part ear-r"><path d="M43 21c8-3 13 6 10.5 15-.8 2.8-4.8 2.4-6.6-.6-1.6-2.7-2.6-7-3.4-10.8" /></g>
        <path d="M20 26c0-7 5.4-11 12-11s12 4 12 11v10c0 9-5.6 15-12 15s-12-6-12-15z" />
        <circle class="fill" cx="26.5" cy="31" r="1.7" />
        <circle class="fill" cx="37.5" cy="31" r="1.7" />
        <path class="fill" d="M29.6 37.6h4.8L32 40.4z" />
        <path d="M32 40.4v2.4M27.6 43c1.4 1.6 3 1.8 4.4.2 1.4 1.6 3 1.4 4.4-.2" />
        <path class="part tongue tint" d="M30 44.4v2.6c0 3 4 3 4 0v-2.6" />
      </g>
    </svg>
  }
  @case ('gato') {
    <svg class="ico cat" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
      <path d="M19.5 25 17 11l10.5 6.5" />
      <g class="part ear-r"><path d="M44.5 25 47 11l-10.5 6.5" /></g>
      <path d="M16 32c0-9.5 7-15.5 16-15.5S48 22.5 48 32c0 10.5-7 18-16 18s-16-7.5-16-18z" />
      <ellipse class="fill part eye" cx="25" cy="31.5" rx="1.9" ry="2.6" />
      <ellipse class="fill part eye" cx="39" cy="31.5" rx="1.9" ry="2.6" />
      <path class="fill" d="M30.4 37.6h3.2L32 39.4z" />
      <path d="M32 39.4c0 2-2.2 2.9-3.8 1.7M32 39.4c0 2 2.2 2.9 3.8 1.7" />
      <g class="part wh-l"><path d="M23 38.5H12.5M23 41l-9.5 2.4" /></g>
      <g class="part wh-r"><path d="M41 38.5h10.5M41 41l9.5 2.4" /></g>
    </svg>
  }
  @case ('conejo') {
    <svg class="ico rab" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
      <path d="M27.5 26c-2.8-7-3.6-16-1.6-19.4 1.8-2.6 4.6 1.4 5.4 8.4.4 3.6.2 7.4-.2 11" />
      <g class="part ear-r"><path d="M35 25.6c.6-6.6 2.4-14.6 5.4-17 2.6-2 3.6 2.6 2.2 8.6-.9 3.8-2.6 7.2-4.4 10" /></g>
      <path d="M19 38c0-8 5.8-12.5 13-12.5S45 30 45 38c0 7.8-5.8 13-13 13s-13-5.2-13-13z" />
      <circle class="fill" cx="26.5" cy="36.5" r="1.6" />
      <circle class="fill" cx="37.5" cy="36.5" r="1.6" />
      <path class="fill part nose" d="M30.6 41h2.8L32 42.6z" />
      <g class="part jaw"><path d="M32 42.6v1.6M29.4 45.2c1.2 1 2.6.6 2.6-1 0 1.6 1.4 2 2.6 1" /></g>
      <path d="M24 42.4h-6M24 44.4l-5 1.4M40 42.4h6M40 44.4l5 1.4" />
      <g class="part leaf">
        <path class="tint" d="M33 47.6c2.6-1 6.4-.4 8.6 2.2-2.8 1.2-6.4.4-8.6-2.2z" />
        <path d="M33 47.6l6 1.3" />
      </g>
    </svg>
  }
  @case ('huellas') {
    <svg class="paws" viewBox="0 0 150 56" role="img" [attr.aria-label]="etiqueta()">
      @for (pos of posicionesHuellas; track $index) {
        <g [class]="'paw p' + ($index + 1)" [attr.transform]="'translate(' + pos + ')'">
          <path d="M12 13.2c-3.1 0-5.6 2.6-5.6 4.7 0 1.6 1.3 2.5 2.8 2.2 1-.2 1.8-.6 2.8-.6s1.8.4 2.8.6c1.5.3 2.8-.6 2.8-2.2 0-2.1-2.5-4.7-5.6-4.7z" />
          <ellipse cx="6.6" cy="10" rx="1.7" ry="2.2" />
          <ellipse cx="10" cy="6.6" rx="1.7" ry="2.3" />
          <ellipse cx="14" cy="6.6" rx="1.7" ry="2.3" />
          <ellipse cx="17.4" cy="10" rx="1.7" ry="2.2" />
        </g>
      }
    </svg>
  }
}
