<div class="min-h-screen flex bg-white font-sans">
  
  <!-- Sidebar Panel -->
  <aside class="w-64 bg-[#EAEBE8] flex flex-col justify-between min-h-screen py-8 px-0">
    <div class="space-y-8">
      
      <!-- Usuario Info -->
      <div class="flex flex-col items-center space-y-1">
        <img 
          [src]="adminUser.avatarUrl" 
          alt="Avatar Admin" 
          class="w-14 h-14 rounded-full object-cover shadow-sm"
        />
        <h4 class="font-bold text-black text-sm mt-2">{{ adminUser.name }}</h4>
        <span class="text-[10px] text-black font-medium">{{ adminUser.role }}</span>
      </div>

      <div class="w-full h-px bg-gray-300 my-6"></div>

      <!-- Menú de Navegación -->
      <nav class="flex flex-col space-y-1 text-xs font-bold text-black px-4">
        <a 
          routerLink="/inicio-admin"
          routerLinkActive="bg-white rounded-md shadow-sm text-[#2C2C6A]" 
          [routerLinkActiveOptions]="{exact: true}"
          class="flex items-center space-x-3 px-3 py-2.5 hover:bg-white/50 rounded-md transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
          <span>HOME(EJEMPLO)</span>
        </a>

        <a 
          routerLink="/patologias"
          routerLinkActive="bg-white rounded-md shadow-sm text-[#2C2C6A]"
          class="flex items-center space-x-3 px-3 py-2.5 hover:bg-white/50 rounded-md transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" /></svg>
          <span>PATOLOGIA</span>
        </a>

        <a 
          routerLink="/examenes-clinicos"
          routerLinkActive="bg-white rounded-md shadow-sm text-[#2C2C6A]"
          class="flex items-center space-x-3 px-3 py-2.5 hover:bg-white/50 rounded-md transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
          <span>EXAMENES MEDICOS</span>
        </a>

        <a 
          routerLink="/listar-medicamentos"
          routerLinkActive="bg-white rounded-md shadow-sm text-[#2C2C6A]"
          class="flex items-center space-x-3 px-3 py-2.5 hover:bg-white/50 rounded-md transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" /></svg>
          <span>MEDICAMENTOS</span>
        </a>

        <a 
          routerLink="/listar-especies"
          routerLinkActive="bg-white rounded-md shadow-sm text-[#2C2C6A]"
          class="flex items-center space-x-3 px-3 py-2.5 hover:bg-white/50 rounded-md transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
          <span>ESPECIES</span>
        </a>
      </nav>
    </div>

    <!-- Cierre de Sesión -->
    <div class="px-7 pb-4">
      <button 
        (click)="onLogout()" 
        class="text-[11px] font-bold text-[#4F46E5] hover:text-[#3730A3] transition-colors">
        CERRAR SESIÓN
      </button>
    </div>
  </aside>

  <!-- Contenido Central Vistas Hijas -->
  <main class="flex-1 overflow-y-auto">
    <router-outlet></router-outlet>
  </main>

</div>
