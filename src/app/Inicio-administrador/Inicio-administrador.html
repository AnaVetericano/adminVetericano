<div class="h-[100dvh] w-full flex overflow-hidden bg-white relative">

  <!-- BOTÓN MÓVIL PARA ABRIR/CERRAR EL MENÚ -->
  <button 
    type="button" 
    (click)="menuAbierto = !menuAbierto" 
    class="lg:hidden absolute top-4 left-4 z-50 p-2.5 rounded-lg bg-[#1B1947] text-white shadow-md focus:outline-none"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <!-- SIDEBAR (TIPO VS CODE: COLAPSADA EN ESCRITORIO, SE EXPANDE AL PASAR EL MOUSE) -->
  <aside 
    [class.translate-x-0]="menuAbierto"
    [class.-translate-x-full]="!menuAbierto"
    class="group fixed lg:translate-x-0 inset-y-0 left-0 z-40 w-20 hover:w-[270px] bg-[#E3E1DC] flex flex-col transition-all duration-300 ease-in-out shadow-2xl lg:shadow-none border-r border-slate-300/50 overflow-hidden"
  >

    <!-- PERFIL -->
    <div class="flex items-center gap-3 pt-8 pb-5 px-4 border-b border-slate-300/70 whitespace-nowrap">
      <div class="w-12 h-12 shrink-0 rounded-full overflow-hidden border-2 border-white shadow-md bg-slate-300 flex items-center justify-center">
        <img
          [src]="adminUser.avatarUrl"
          [alt]="adminUser.name"
          class="w-full h-full object-cover"
        />
      </div>
      <div class="opacity-0 group-hover:opacity-100 transition-opacity duration-200 overflow-hidden">
        <h2 class="text-xs font-semibold text-slate-800 truncate">
          {{ adminUser.name }}
        </h2>
        <p class="text-[9px] text-slate-500 font-bold tracking-wider truncate">
          {{ adminUser.role }}
        </p>
      </div>
    </div>

    <!-- NAVEGACIÓN -->
    <nav class="flex-1 px-3 pt-5 space-y-1 overflow-y-auto overflow-x-hidden">

      <!-- PATOLOGÍAS -->
      <a
        routerLink="/patologias"
        routerLinkActive="bg-[#1B1947]/10 text-[#1B1947]"
        (click)="menuAbierto = false"
        class="flex items-center gap-4 px-3 py-3 rounded-lg hover:bg-[#1B1947]/10 transition-colors cursor-pointer text-slate-700 whitespace-nowrap"
      >
        <img src="images/iconpatologia.svg" alt="Icono Patología" class="w-6 h-6 object-contain shrink-0">
        <span class="text-xs font-bold tracking-widest uppercase opacity-0 group-hover:opacity-100 transition-opacity duration-200">Patología</span>
      </a>

      <!-- EXÁMENES MÉDICOS -->
      <a
        routerLink="/examenes-clinicos"
        routerLinkActive="bg-[#1B1947]/10 text-[#1B1947]"
        (click)="menuAbierto = false"
        class="flex items-center gap-4 px-3 py-3 rounded-lg hover:bg-[#1B1947]/10 transition-colors cursor-pointer text-slate-700 whitespace-nowrap"
      >
        <img src="images/iconexamnesmedicos.svg" alt="Icono Exámenes" class="w-6 h-6 object-contain shrink-0">
        <span class="text-xs font-bold tracking-widest uppercase opacity-0 group-hover:opacity-100 transition-opacity duration-200">Exámenes Médicos</span>
      </a>

      <!-- MEDICAMENTOS -->
      <a
        routerLink="/listarmedicamentos"
        routerLinkActive="bg-[#1B1947]/10 text-[#1B1947]"
        (click)="menuAbierto = false"
        class="flex items-center gap-4 px-3 py-3 rounded-lg hover:bg-[#1B1947]/10 transition-colors cursor-pointer text-slate-700 whitespace-nowrap"
      >
        <img src="images/iconmedication.svg" alt="Icono Medicamentos" class="w-6 h-6 object-contain shrink-0">
        <span class="text-xs font-bold tracking-widest uppercase opacity-0 group-hover:opacity-100 transition-opacity duration-200">Medicamentos</span>
      </a>

      <!-- ESPECIES -->
      <a
        routerLink="/listarespecies"
        routerLinkActive="bg-[#1B1947]/10 text-[#1B1947]"
        (click)="menuAbierto = false"
        class="flex items-center gap-4 px-3 py-3 rounded-lg hover:bg-[#1B1947]/10 transition-colors cursor-pointer text-slate-700 whitespace-nowrap"
      >
        <img src="images/iconpetsespecies.svg" alt="Icono Especies" class="w-6 h-6 object-contain shrink-0">
        <span class="text-xs font-bold tracking-widest uppercase opacity-0 group-hover:opacity-100 transition-opacity duration-200">Especies</span>
      </a>

      <!-- USUARIOS -->
      <a
        routerLink="/usuarios-roles"
        routerLinkActive="bg-[#1B1947]/10 text-[#1B1947]"
        (click)="menuAbierto = false"
        class="flex items-center gap-4 px-3 py-3 rounded-lg hover:bg-[#1B1947]/10 transition-colors cursor-pointer text-slate-700 whitespace-nowrap"
      >
        <img src="images/iconusuario.svg" alt="Icono Usuarios" class="w-6 h-6 object-contain shrink-0">
        <span class="text-xs font-bold tracking-widest uppercase opacity-0 group-hover:opacity-100 transition-opacity duration-200">Usuarios</span>
      </a>

    </nav>

    <!-- CERRAR SESIÓN -->
    <div class="px-3 pb-6 pt-3 border-t border-slate-300/70 whitespace-nowrap">
      <a
        (click)="onLogout()"
        class="flex items-center gap-4 px-3 py-2.5 rounded-lg cursor-pointer text-xs font-bold text-[#1B1947] hover:bg-[#1B1947]/10 tracking-widest uppercase transition-colors"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-200">Cerrar Sesión</span>
      </a>
    </div>

  </aside>

  <!-- OVERLAY OSCURO EN MÓVIL CUANDO EL MENÚ ESTÁ ABIERTO -->
  <div 
    *ngIf="menuAbierto" 
    (click)="menuAbierto = false" 
    class="fixed inset-0 bg-black/40 z-30 lg:hidden backdrop-blur-sm"
  ></div>

  <!-- ÁREA DE CONTENIDO PRINCIPAL -->
  <main class="flex-1 bg-white h-full overflow-y-auto">
    <router-outlet></router-outlet>
  </main>

</div>
