<div class="h-[100dvh] w-full flex overflow-hidden bg-white relative">

  <!-- BOTÓN MÓVIL -->
  <button 
    type="button" 
    (click)="menuAbierto = !menuAbierto" 
    class="lg:hidden absolute top-3 left-3 z-50 p-2.5 rounded-xl bg-[#1B1947] text-white shadow-md focus:outline-none active:scale-95 transition-transform"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>

  <!-- BARRA LATERAL (TAMAÑO EQUILIBRADO Y SIN FONDO AZUL) -->
  <aside 
    [class.translate-x-0]="menuAbierto"
    [class.-translate-x-full]="!menuAbierto"
    class="group fixed lg:translate-x-0 inset-y-0 left-0 z-40 w-20 hover:w-[260px] bg-[#E3E1DC] flex flex-col transition-all duration-300 ease-in-out shadow-lg lg:shadow-sm border-r border-slate-300/60 overflow-hidden shrink-0"
  >

    <!-- AVATAR -->
    <div class="flex items-center gap-3 py-4 px-3.5 border-b border-slate-300/70 whitespace-nowrap">
      <div class="w-11 h-11 shrink-0 rounded-full overflow-hidden border-2 border-white shadow-sm bg-slate-300 flex items-center justify-center transition-transform duration-300 group-hover:scale-105">
        <img
          [src]="adminUser.avatarUrl"
          [alt]="adminUser.name"
          class="w-full h-full eobject-cover"
        />
      </div>
      <div class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 overflow-hidden">
        <h2 class="text-xs font-extrabold text-slate-800 truncate">
          {{ adminUser.name }}
        </h2>
        <p class="text-[9px] text-slate-500 font-bold tracking-wider uppercase truncate">
          {{ adminUser.role }}
        </p>
      </div>
    </div>

    <!-- ENLACES (TEXTO ACTIVO EN OSCURO SIN FONDO AZUL) -->
    <nav class="flex-1 px-3 pt-4 space-y-1.5 overflow-y-auto overflow-x-hidden">

       <a
        routerLink="/inicio-admin"
        routerLinkActive="text-[#1B1947] font-extrabold scale-[1.02]"
        (click)="menuAbierto = false"
        class="flex items-center gap-4 px-3.5 py-3 rounded-xl hover:bg-slate-300/50 transition-all duration-200 cursor-pointer text-slate-700 whitespace-nowrap group/item"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 shrink-0 text-slate-700 transition-transform duration-200 group-hover/item:scale-110" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        <span class="text-xs font-bold tracking-wider uppercase opacity-0 group-hover:opacity-100 transition-opacity duration-300">Dashboard</span>
      </a>

      

      <a
        routerLink="patologias"
        routerLinkActive="text-[#1B1947] font-extrabold scale-[1.02]"
        (click)="menuAbierto = false"
        class="flex items-center gap-4 px-3.5 py-3 rounded-xl hover:bg-slate-300/50 transition-all duration-200 cursor-pointer text-slate-700 whitespace-nowrap group/item"
      >
        <img src="images/iconpatologia.svg" alt="Icono Patología" class="w-6 h-6 object-contain shrink-0 transition-transform duration-200 group-hover/item:scale-110">
        <span class="text-xs font-bold tracking-wider uppercase opacity-0 group-hover:opacity-100 transition-opacity duration-300">Patología</span>
      </a>

      <a
        routerLink="examenes-clinicos"
        routerLinkActive="text-[#1B1947] font-extrabold scale-[1.02]"
        (click)="menuAbierto = false"
        class="flex items-center gap-4 px-3.5 py-3 rounded-xl hover:bg-slate-300/50 transition-all duration-200 cursor-pointer text-slate-700 whitespace-nowrap group/item"
      >
        <img src="images/iconexamnesmedicos.svg" alt="Icono Exámenes" class="w-6 h-6 object-contain shrink-0 transition-transform duration-200 group-hover/item:scale-110">
        <span class="text-xs font-bold tracking-wider uppercase opacity-0 group-hover:opacity-100 transition-opacity duration-300">Exámenes Clínicos</span>
      </a>

      <a
        routerLink="listarmedicamentos"
        routerLinkActive="text-[#1B1947] font-extrabold scale-[1.02]"
        (click)="menuAbierto = false"
        class="flex items-center gap-4 px-3.5 py-3 rounded-xl hover:bg-slate-300/50 transition-all duration-200 cursor-pointer text-slate-700 whitespace-nowrap group/item"
      >
        <img src="images/iconmedication.svg" alt="Icono Medicamentos" class="w-6 h-6 object-contain shrink-0 transition-transform duration-200 group-hover/item:scale-110">
        <span class="text-xs font-bold tracking-wider uppercase opacity-0 group-hover:opacity-100 transition-opacity duration-300">Medicamentos</span>
      </a>

      <a
        routerLink="especies"
        routerLinkActive="text-[#1B1947] font-extrabold scale-[1.02]"
        (click)="menuAbierto = false"
        class="flex items-center gap-4 px-3.5 py-3 rounded-xl hover:bg-slate-300/50 transition-all duration-200 cursor-pointer text-slate-700 whitespace-nowrap group/item"
      >
        <img src="images/iconpetsespecies.svg" alt="Icono Especies" class="w-6 h-6 object-contain shrink-0 transition-transform duration-200 group-hover/item:scale-110">
        <span class="text-xs font-bold tracking-wider uppercase opacity-0 group-hover:opacity-100 transition-opacity duration-300">Especies</span>
      </a>

      <a
        routerLink="usuarios-roles"
        routerLinkActive="text-[#1B1947] font-extrabold scale-[1.02]"
        (click)="menuAbierto = false"
        class="flex items-center gap-4 px-3.5 py-3 rounded-xl hover:bg-slate-300/50 transition-all duration-200 cursor-pointer text-slate-700 whitespace-nowrap group/item"
      >
        <img src="images/iconusuario.svg" alt="Icono Usuarios" class="w-6 h-6 object-contain shrink-0 transition-transform duration-200 group-hover/item:scale-110">
        <span class="text-xs font-bold tracking-wider uppercase opacity-0 group-hover:opacity-100 transition-opacity duration-300">Usuarios</span>
      </a>

    </nav>

    <!-- CERRAR SESIÓN -->
    <div class="px-3 pb-4 pt-3 border-t border-slate-300/75 whitespace-nowrap">
      <a
        (click)="onLogout()"
        class="flex items-center gap-4 px-3.5 py-2.5 rounded-xl cursor-pointer text-xs font-bold text-red-600 hover:bg-red-50 tracking-wider uppercase transition-all duration-200 group/logout"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 shrink-0 transition-transform duration-200 group-hover/logout:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        <span class="opacity-0 group-hover:opacity-100 transition-opacity duration-300">Cerrar Sesión</span>
      </a>
    </div>
    
  </aside>

  <!-- FONDO MÓVIL -->
  <div 
    *ngIf="menuAbierto" 
    (click)="menuAbierto = false" 
    class="fixed inset-0 bg-black/40 z-30 lg:hidden backdrop-blur-sm transition-opacity"
  ></div>

  <!-- CONTENEDOR PRINCIPAL AJUSTADO A w-20 -->
  <main class="flex-1 bg-white h-full overflow-y-auto lg:ml-20 transition-all duration-300">
    <router-outlet></router-outlet>
  </main>


</div>
