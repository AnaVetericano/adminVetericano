<div class="flex flex-col md:flex-row min-h-screen w-full">
  
  <div class="w-full md:w-1/2 bg-[#EBECE6] p-8 md:p-12 flex flex-col justify-between items-center text-center">
    <div class="mt-8 md:mt-16">
      <div class="text-[#3B38A6] font-semibold text-xl tracking-wider flex items-center justify-center gap-2 mb-6">
        <span>♡</span> VETERICANO
      </div>

      <p class="text-gray-700 text-sm leading-relaxed max-w-sm mx-auto">
        Panel de administración para gestionar peticiones, rescates y coordinación de equipos veterinarios. Administra y supervisa todas las operaciones de rescate
      </p>
    </div>

    <div class="mt-10 flex-grow flex items-end justify-center w-full max-w-md">
      <img src="/images/perrojuan1.png" alt="Perro" class="w-full h-auto object-contain">
    </div>
  </div>

  <div class="w-full md:w-1/2 bg-white p-8 md:p-12 flex flex-col items-center justify-center">

    <div class="w-32 mb-6">
      <img src="/images/logoVet.svg" alt="Vetericano" class="w-full h-auto mx-auto">
    </div>

    <h1 class="text-3xl font-bold text-[#3B38A6] mb-8">Bienvenido</h1>

    <form (ngSubmit)="registrarse()" class="w-full max-w-md space-y-5">

      <div class="flex items-center bg-white border border-gray-200 rounded-full px-5 py-3 shadow-sm focus-within:border-[#3B38A6] transition">
        <svg class="w-5 h-5 text-gray-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
        </svg>
        <input
          type="text"
          name="email"
          [(ngModel)]="register.email"
          placeholder="Email"
          required
          class="w-full bg-transparent text-sm focus:outline-none text-gray-700 placeholder-gray-400"
        >
      </div>

      <div class="flex items-center bg-white border border-gray-200 rounded-full px-5 py-3 shadow-sm focus-within:border-[#3B38A6] transition">
        <svg class="w-5 h-5 text-gray-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>
        <input
          type="password"
          name="password"
          [(ngModel)]="register.password"
          placeholder="Contraseña"
          required
          class="w-full bg-transparent text-sm focus:outline-none text-gray-700 placeholder-gray-400"
        >
      </div>

      <div class="flex items-center bg-white border border-gray-200 rounded-full px-5 py-3 shadow-sm focus-within:border-[#3B38A6] transition">
        <svg class="w-5 h-5 text-gray-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        <input
          type="text"
          name="nombre"
          [(ngModel)]="register.nombre"
          placeholder="Nombre"
          required
          class="w-full bg-transparent text-sm focus:outline-none text-gray-700 placeholder-gray-400"
        >
      </div>

      <div class="flex items-center bg-white border border-gray-200 rounded-full px-5 py-3 shadow-sm focus-within:border-[#3B38A6] transition">
        <svg class="w-5 h-5 text-gray-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        <input
          type="text"
          name="ape"
          [(ngModel)]="register.apellido"
          placeholder="Apellido"
          required
          class="w-full bg-transparent text-sm focus:outline-none text-gray-700 placeholder-gray-400"
        >
      </div>

      <button
        type="submit"
        class="w-full bg-[#3B38A6] hover:bg-[#2F2C86] text-white font-medium py-3 rounded-full shadow-md transition duration-200 mt-4">
        Registrarse
      </button>

    </form>

    <div class="relative w-full max-w-md flex py-6 items-center">
      <div class="flex-grow border-t border-gray-200"></div>
      <span class="flex-shrink mx-4 text-sm text-gray-500 font-medium">O inicia con</span>
      <div class="flex-grow border-t border-gray-200"></div>
    </div>

    <p class="text-sm text-gray-600">
      ¿Ya tienes cuenta?
      <a (click)="iniciarSesion()" class="text-[#3B38A6] font-semibold underline cursor-pointer hover:text-[#2F2C86]">Inicia sesión</a>
    </p>

  </div>
</div>
