<div class="h-[100dvh] w-full flex flex-col lg:flex-row overflow-hidden bg-white">
  
  <!-- PANEL IZQUIERDO -->
  <div class="w-full lg:w-1/2 h-[35%] lg:h-full bg-[#EBECE6] px-6 lg:px-12 py-4 lg:py-8 flex flex-col justify-between items-center text-center relative overflow-hidden">
    <div class="z-10">
      <div class="text-[#3B38A6] font-semibold text-lg lg:text-xl tracking-wider flex items-center justify-center gap-2 mb-2">
        <span>♡</span> VETERICANO
      </div>

      <p class="text-gray-700 text-xs lg:text-sm leading-relaxed max-w-sm mx-auto">
        Panel de administración para gestionar peticiones, rescates y coordinación de equipos veterinarios. Administra y supervisa todas las operaciones de rescate
      </p>
    </div>

    <!-- Imagen del Perro más grande y controlada -->
    <div class="absolute inset-x-0 bottom-0 flex justify-center items-end pointer-events-none">
<img src="/images/perrojuan1.png" alt="Perro" class="w-[340px] lg:max-w-lg max-h-[30vh] lg:max-h-[60vh] object-contain">
</div>
  </div>

  <!-- PANEL DERECHO (Formulario de Registro sin scroll) -->
  <div class="w-full lg:w-1/2 h-[65%] lg:h-full bg-white px-6 lg:px-12 py-3 lg:py-6 flex flex-col items-center justify-center">

    <div class="w-20 lg:w-24 mb-2">
      <img src="/images/logoVet.svg" alt="Vetericano" class="w-full h-auto mx-auto object-contain">
    </div>

    <h1 class="text-2xl lg:text-3xl font-bold text-[#3B38A6] mb-2 lg:mb-4">Bienvenido</h1>

    <form (ngSubmit)="registrarse()" class="w-full max-w-md space-y-2.5 lg:space-y-3">

      <div class="flex items-center bg-white border border-gray-200 rounded-full px-4 lg:px-5 py-2 lg:py-2.5 shadow-sm focus-within:border-[#3B38A6] transition">
        <svg class="w-4 h-4 text-gray-400 mr-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
        </svg>
        <input
          type="text"
          name="email"
          [(ngModel)]="register.email"
          placeholder="Email"
          required
          class="w-full bg-transparent text-xs lg:text-sm focus:outline-none text-gray-700 placeholder-gray-400"
        >
      </div>
        <div class="flex items-center bg-white border border-gray-200 rounded-full px-4 lg:px-5 py-2 lg:py-2.5 shadow-sm focus-within:border-[#3B38A6] transition">
          <svg class="w-4 h-4 text-gray-400 mr-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
          <input
            type="text"
            name="ape"
            [(ngModel)]="register.identificacion"
            placeholder="Numero de identificación"
            required
            class="w-full bg-transparent text-xs lg:text-sm focus:outline-none text-gray-700 placeholder-gray-400">
        </div>

      <div class="flex items-center bg-white border border-gray-200 rounded-full px-4 lg:px-5 py-2 lg:py-2.5 shadow-sm focus-within:border-[#3B38A6] transition">
        <svg class="w-4 h-4 text-gray-400 mr-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>
        <input
          type="password"
          name="password"
          [(ngModel)]="register.password"
          placeholder="Contraseña"
          required
          class="w-full bg-transparent text-xs lg:text-sm focus:outline-none text-gray-700 placeholder-gray-400"
        >
      </div>

      <div class="flex items-center bg-white border border-gray-200 rounded-full px-4 lg:px-5 py-2 lg:py-2.5 shadow-sm focus-within:border-[#3B38A6] transition">
        <svg class="w-4 h-4 text-gray-400 mr-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        <input
          type="text"
          name="nombre"
          [(ngModel)]="register.nombre"
          placeholder="Nombre"
          required
          class="w-full bg-transparent text-xs lg:text-sm focus:outline-none text-gray-700 placeholder-gray-400"
        >
      </div>

        <div class="flex items-center bg-white border border-gray-200 rounded-full px-4 lg:px-5 py-2 lg:py-2.5 shadow-sm focus-within:border-[#3B38A6] transition">
          <svg class="w-4 h-4 text-gray-400 mr-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
          <input
            type="text"
            name="ape"
            [(ngModel)]="register.apellido"
            placeholder="Apellido"
            required
            class="w-full bg-transparent text-xs lg:text-sm focus:outline-none text-gray-700 placeholder-gray-400">
        </div>

      <button
        type="submit"
        class="w-full bg-[#3B38A6] hover:bg-[#2F2C86] text-white font-medium py-2.5 rounded-full shadow-md transition duration-200 text-xs lg:text-sm mt-1">
        Registrarse
      </button>

    </form>

    <div class="relative w-full max-w-md flex py-2 items-center">
      <div class="flex-grow border-t border-gray-200"></div>
      <span class="flex-shrink mx-4 text-xs text-gray-500 font-medium">O inicia con</span>
      <div class="flex-grow border-t border-gray-200"></div>
    </div>

    <p class="text-xs lg:text-sm text-gray-600">
      ¿Ya tienes cuenta?
      <a (click)="iniciarSesion()" class="text-[#3B38A6] font-semibold underline cursor-pointer hover:text-[#2F2C86]">Inicia sesión</a>
    </p>

  </div>
</div>
