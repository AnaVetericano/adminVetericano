<div class="h-[100dvh] w-full flex flex-col lg:flex-row overflow-hidden bg-white font-['Nunito',sans-serif] selection:bg-[#4141a5] selection:text-white">
  
  <!-- PANEL IZQUIERDO -->
  <div class="w-full lg:w-1/2 h-[35%] lg:h-full bg-[#F4F5F7] px-6 lg:px-12 py-4 lg:py-8 flex flex-col justify-between items-center text-center relative overflow-hidden border-b lg:border-b-0 lg:border-r border-gray-200">
    <div class="z-10">
      <div class="text-[#4141a5] font-extrabold text-lg lg:text-xl tracking-wider flex items-center justify-center gap-2 mb-2 uppercase">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-[#4141a5]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4.318 6.318a4.5 4.5 0 016.364 0L12 7.636l1.318-1.318a4.5 4.5 0 016.364 6.364L12 21.364 4.318 12.682a4.5 4.5 0 010-6.364z"/>
        </svg>
        <span>VETERICANO</span>
      </div>

      <p class="text-gray-600 text-xs lg:text-sm leading-relaxed max-w-sm mx-auto">
        Panel de administración para gestionar peticiones, rescates y coordinación de equipos veterinarios. Administra y supervisa todas las operaciones de rescate.
      </p>
    </div>

    <!-- Imagen del Perro -->
    <div class="absolute inset-x-0 bottom-0 flex justify-center items-end pointer-events-none">
      <img src="/images/perrojuan1.png" alt="Perro" class="w-[340px] lg:max-w-lg max-h-[30vh] lg:max-h-[60vh] object-contain">
    </div>
  </div>

  <!-- PANEL DERECHO (Formulario de Registro) -->
  <div class="w-full lg:w-1/2 h-[65%] lg:h-full bg-white px-6 lg:px-12 py-3 lg:py-6 flex flex-col items-center justify-center overflow-y-auto">

    <div class="w-20 lg:w-24 mb-2 shrink-0">
      <img src="/images/logoVet.svg" alt="Vetericano" class="w-full h-auto mx-auto object-contain">
    </div>

    <h1 class="text-2xl lg:text-3xl font-extrabold text-[#170B3D] uppercase tracking-wider mb-1">Crear Cuenta</h1>
    <p class="text-xs lg:text-sm font-medium text-gray-500 mb-3 lg:mb-4">Registra tus datos para acceder al sistema</p>

    <form (ngSubmit)="registrarse()" class="w-full max-w-md space-y-2.5 lg:space-y-3">

      <!-- Email -->
      <div class="flex items-center bg-white border border-gray-200 rounded-2xl px-4 lg:px-5 py-2 lg:py-2.5 shadow-xs focus-within:border-[#4141a5] focus-within:ring-2 focus-within:ring-[#4141a5]/20 transition-all">
        <svg class="w-4 h-4 text-gray-400 mr-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
        </svg>
        <input
          type="text"
          name="email"
          [(ngModel)]="register.email"
          placeholder="Correo electrónico"
          required
          class="w-full bg-transparent text-xs lg:text-sm outline-none text-gray-700 placeholder-gray-400">
      </div>

      <!-- Identificación -->
      <div class="flex items-center bg-white border border-gray-200 rounded-2xl px-4 lg:px-5 py-2 lg:py-2.5 shadow-xs focus-within:border-[#4141a5] focus-within:ring-2 focus-within:ring-[#4141a5]/20 transition-all">
        <svg class="w-4 h-4 text-gray-400 mr-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"></path>
        </svg>
        <input
          type="text"
          name="identificacion"
          [(ngModel)]="register.identificacion"
          placeholder="Número de identificación"
          required
          class="w-full bg-transparent text-xs lg:text-sm outline-none text-gray-700 placeholder-gray-400">
      </div>

      <!-- Nombre -->
      <div class="flex items-center bg-white border border-gray-200 rounded-2xl px-4 lg:px-5 py-2 lg:py-2.5 shadow-xs focus-within:border-[#4141a5] focus-within:ring-2 focus-within:ring-[#4141a5]/20 transition-all">
        <svg class="w-4 h-4 text-gray-400 mr-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        <input
          type="text"
          name="nombre"
          [(ngModel)]="register.nombre"
          placeholder="Nombre"
          required
          class="w-full bg-transparent text-xs lg:text-sm outline-none text-gray-700 placeholder-gray-400">
      </div>

      <!-- Apellido -->
      <div class="flex items-center bg-white border border-gray-200 rounded-2xl px-4 lg:px-5 py-2 lg:py-2.5 shadow-xs focus-within:border-[#4141a5] focus-within:ring-2 focus-within:ring-[#4141a5]/20 transition-all">
        <svg class="w-4 h-4 text-gray-400 mr-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        <input
          type="text"
          name="apellido"
          [(ngModel)]="register.apellido"
          placeholder="Apellido"
          required
          class="w-full bg-transparent text-xs lg:text-sm outline-none text-gray-700 placeholder-gray-400">
      </div>

      <!-- Contraseña -->
      <div class="flex items-center bg-white border border-gray-200 rounded-2xl px-4 lg:px-5 py-2 lg:py-2.5 shadow-xs focus-within:border-[#4141a5] focus-within:ring-2 focus-within:ring-[#4141a5]/20 transition-all">
        <svg class="w-4 h-4 text-gray-400 mr-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>
        <input
          [type]="mostrarPassword ? 'text' : 'password'"
          name="password"
          [(ngModel)]="register.password"
          placeholder="Contraseña"
          required
          class="flex-1 bg-transparent text-xs lg:text-sm outline-none text-gray-700 placeholder-gray-400">
        <button
          type="button"
          (click)="mostrarPassword = !mostrarPassword"
          class="text-gray-400 hover:text-[#4141a5] focus:outline-none ml-2 shrink-0 transition-colors cursor-pointer"
          [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Ver contraseña'"
          [title]="mostrarPassword ? 'Ocultar contraseña' : 'Ver contraseña'">
          <!-- Icono Ojo (Mostrar) cuando está oculta -->
          <svg *ngIf="!mostrarPassword" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <!-- Icono Ojo Tachado (Ocultar) cuando está visible -->
          <svg *ngIf="mostrarPassword" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
          </svg>
        </button>
      </div>

      <button
        type="submit"
        class="w-full bg-[#4141a5] hover:bg-[#33338b] text-white font-bold py-3 rounded-2xl shadow-md transition-all text-xs sm:text-sm uppercase tracking-wider active:scale-95 cursor-pointer mt-1">
        Registrarse
      </button>

    </form>

    <p class="text-xs lg:text-sm text-gray-600 mt-4 font-medium">
      ¿Ya tienes cuenta?
      <a (click)="iniciarSesion()" class="text-[#4141a5] font-bold hover:underline cursor-pointer ml-1">Inicia sesión</a>
    </p>

  </div>
</div>
