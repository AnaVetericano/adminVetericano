<div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
  <!-- CONTENEDOR PRINCIPAL -->
  <div class="flex flex-col md:flex-row w-full max-w-4xl bg-white rounded-2xl shadow-xl overflow-hidden">

    <!-- PARTE IZQUIERDA -->
    <div class="md:w-1/2 bg-[#EBECE6] p-8 flex flex-col justify-between items-center text-center">
      <div>
        <!-- TITULO -->
        <div class="text-[#3B38A6] font-semibold text-xl tracking-wider flex items-center justify-center gap-2 mb-6">
          <span>♡</span> VETERICANO
        </div>

        <!-- DESCRIPCIÓN -->
        <p class="text-gray-700 text-sm leading-relaxed max-w-xs mx-auto">
          Panel de administración para gestionar peticiones, rescates y coordinación de equipos veterinarios. Administra y supervisa todas las operaciones de rescate
        </p>
      </div>

      <!-- IMAGEN PERRITO -->
      <div class="mt-6 max-w-xs bg">
        <img src="/images/perrojuan1.png" alt="Perro" class="w-full h-auto object-contain">
      </div>
    </div>


    <!-- PARTE DERECHA -->
    <div class="md:w-1/2 bg-white p-8 flex flex-col items-center justify-center">

      <!-- LOGO -->
      <div class="w-28 mb-4">
        <img src="/images/logoVet.svg" alt="Vetericano " class="w-full h-auto mx-auto">
      </div>

      <h1 class="text-2xl font-bold text-[#3B38A6] mb-6">Bienvenido</h1>

      <!-- FORMULARIO -->
      <form (ngSubmit)="registrarse()" class="w-full max-w-sm space-y-4">

        
        

        <!-- EMAIL -->
        <div class="flex items-center bg-white border border-gray-200 rounded-full px-4 py-2.5 shadow-sm focus-within:border-[#3B38A6] transition">
          
          <input
            type="text"
            name="email"
            [(ngModel)]="register.email"
            placeholder="Email"
            required
            class="w-full bg-transparent text-sm focus:outline-none text-gray-700 placeholder-gray-400"
          >
        </div>

        
        <div class="flex items-center bg-white border border-gray-200 rounded-full px-4 py-2.5 shadow-sm focus-within:border-[#3B38A6] transition">
          
          <input
            type="password"
            name="password"
            [(ngModel)]="register.password"
            placeholder="Contraseña"
            required
            class="w-full bg-transparent text-sm focus:outline-none text-gray-700 placeholder-gray-400"
          >
        </div>

      
        <div class="flex items-center bg-white border border-gray-200 rounded-full px-4 py-2.5 shadow-sm focus-within:border-[#3B38A6] transition">
          
          <input
            type="text"
            name="nombre"
            [(ngModel)]="register.nombre"
            placeholder="Nombre"
            required
            class="w-full bg-transparent text-sm focus:outline-none text-gray-700 placeholder-gray-400"
          >
        </div>

        <div class="flex items-center bg-white border border-gray-200 rounded-full px-4 py-2.5 shadow-sm focus-within:border-[#3B38A6] transition">
        
          <input
            type="text"
            name="ape"
            [(ngModel)]="register.apellido"
            placeholder="Apellido"
            required
            class="w-full bg-transparent text-sm focus:outline-none text-gray-700 placeholder-gray-400"
          >
        </div>
    

        
        <button
          type="submit"
          class="w-full bg-[#3B38A6] hover:bg-[#2F2C86] text-white font-medium py-2.5 rounded-full shadow-md transition duration-200 mt-2">
          Registrarse
        </button>

      </form>

      <div class="relative w-full max-w-sm flex py-4 items-center my-2">
        <div class="flex-grow border-t border-gray-200"></div>
        <span class="flex-shrink mx-4 text-xs text-gray-500 font-medium">O inicia con</span>
        <div class="flex-grow border-t border-gray-200"></div>
      </div>

      <div class="flex justify-center gap-6 mb-4">
        <button type="button" class="p-2 rounded-full hover:bg-gray-100 transition">
          <img src="assets/google.png" alt="Google" class="w-6 h-6 object-contain">
        </button>
        <button type="button" class="p-2 rounded-full hover:bg-gray-100 transition">
          <img src="assets/facebook.png" alt="Facebook" class="w-6 h-6 object-contain">
        </button>
        <button type="button" class="p-2 rounded-full hover:bg-gray-100 transition">
          <img src="assets/apple.png" alt="Apple" class="w-6 h-6 object-contain">
        </button>
      </div>

      <!-- INICIO DE SESIÓN -->
      <p class="text-xs text-gray-600">
        ¿Ya tienes cuenta?
        <a (click)="iniciarSesion()" class="text-[#3B38A6] font-semibold underline cursor-pointer hover:text-[#2F2C86]">Inicia sesión</a>
      </p>

    </div>

  </div>
</div>
