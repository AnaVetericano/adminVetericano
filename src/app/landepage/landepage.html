<div class="min-h-screen w-full flex flex-col md:flex-row">

  <section
    class="w-full md:w-1/2
           bg-white
           flex flex-col
           items-center
           justify-between
           px-10 md:px-14
           py-12"
  >
    
    <div class="flex-1 flex flex-col items-center justify-center w-full">
      
      <div class="text-center">
        <h1
          class="text-4xl md:text-5xl
                 font-extrabold
                 leading-none
                 text-[#7255a5]"
        >
          BIENVENIDO A
        </h1>

        <h2
          class="text-5xl md:text-6xl
                 font-extrabold
                 leading-none
                 text-[#7255a5]"
        >
          VETERICANO
        </h2>

        <p
          class="mt-4
                 text-xl md:text-2xl
                 font-semibold
                 text-black"
        >
          Cuidamos a quienes no tienen voz
        </p>
      </div>

      <div class="w-full max-w-[280px] space-y-4 mt-8">
        <button
          type="button"
          (click)="iniciarSesion()"
          class="w-full h-12
                 rounded-full
                 bg-[#4545aa]
                 text-white
                 text-lg
                 font-medium
                 hover:bg-[#383894]
                 transition
                 duration-200
                 shadow-sm"
        >
          Iniciar Sesión
        </button>

        <button
          type="button"
          (click)="registrarse()"
          class="w-full h-12
                 rounded-full
                 bg-[#f7c83b]
                 text-black
                 text-lg
                 font-medium
                 hover:bg-[#edbb26]
                 transition
                 duration-200
                 shadow-sm"
        >
          Registrar
        </button>
      </div>
      
    </div>

    <div class="mt-8">
      <img
        src="images/logoVet.svg"
        alt="VETERICANO"
        class="w-28 h-auto object-contain mx-auto"
      >
    </div>

  </section>

  <section
    class="w-full md:w-1/2
           bg-[#f0f1ed]
           flex flex-col
           justify-between
           px-8 md:px-16
           py-12"
  >

    <div
      class="flex-1 w-full
             flex items-center justify-center min-h-[300px]"
    >
      <img
        src="images/dogcatimage.png"
        alt="Perro y gato VETERICANO"
        class="w-full h-full max-h-[600px]
               object-contain"
      >
    </div>

    <div class="pt-8">
      <div class="flex items-center gap-2">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.8"
          stroke="currentColor"
          class="w-8 h-8
                 text-[#4545aa]"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21.75 8.25c0 5.25-9.75 11.25-9.75 11.25S2.25 13.5 2.25 8.25a5.25 5.25 0 0 1 9.75-2.79 5.25 5.25 0 0 1 9.75 2.79Z"
          />
        </svg>

        <h3
          class="text-2xl
                 font-serif
                 text-[#4545aa]"
        >
          VETERICANO
        </h3>
      </div>

      <p
        class="mt-2
               text-sm
               leading-relaxed
               text-black
               font-serif"
      >
        Panel de administración para gestionar peticiones,<br>
        rescates y coordinación de equipos veterinarios.<br>
        Administra y supervisa todas las operaciones de rescate.
      </p>
    </div>

  </section>

</div>
