<div class="h-screen w-full flex flex-col lg:flex-row overflow-hidden bg-white font-['Nunito',sans-serif] selection:bg-[#4141A5] selection:text-white">

  <!-- Sección Izquierda (Textos y Botones Centrados) -->
  <section
    class="w-full lg:w-1/2
           h-1/2 lg:h-full
           bg-white
           flex flex-col
           items-center
           justify-center
           px-6 sm:px-12
           py-4 lg:py-8"
  >
    <div class="flex-1 flex flex-col items-center justify-center w-full lg:pb-12">

      <!-- Cabecera y logo centrados -->
      <div class="text-center">
        <p
          class="text-base sm:text-lg lg:text-xl
                 font-bold
                 tracking-[0.18em]
                 uppercase
                 text-[#170B3D]"
        >
          BIENVENIDO A
        </p>

        <h1 class="mt-3 sm:mt-4 flex justify-center">
          <img
            src="images/logo-vetericano.svg"
            alt="VETERICANO"
            width="942"
            height="527"
            class="w-44 sm:w-64 lg:w-80 h-auto object-contain"
          >
        </h1>
      </div>

      <!-- Botones Centrados -->
      <div class="w-full max-w-[280px] lg:max-w-[320px] space-y-3 mt-7 sm:mt-8 lg:mt-10">
        <button
          type="button"
          (click)="iniciarSesion()"
          class="w-full py-3 px-4
                 rounded-lg
                 bg-[#4141A5]
                 text-white
                 text-sm
                 font-semibold
                 hover:bg-[#353583]
                 transition-colors
                 cursor-pointer"
        >
          Iniciar Sesión
        </button>

        <button
          type="button"
          (click)="registrarse()"
          class="w-full py-3 px-4
                 rounded-lg
                 bg-white
                 border border-slate-300
                 text-slate-700
                 text-sm
                 font-semibold
                 hover:bg-slate-50
                 transition-colors
                 cursor-pointer"
        >
          Registrar
        </button>
      </div>

    </div>

  </section>

  <!-- Sección Derecha (Imagen y descripción institucional) -->
  <section
    class="w-full lg:w-1/2
           h-1/2 lg:h-full
           bg-[#F4F5F7]
           flex flex-col
           justify-between
           px-6 sm:px-12
           py-4 lg:py-8 border-t lg:border-t-0 lg:border-l border-slate-200"
  >

    <div
      class="flex-1 w-full
             flex items-center justify-center overflow-hidden"
    >
      <img
        src="images/dogcatimage.png"
        alt="Perro y gato VETERICANO"
        class="w-auto h-full max-h-[220px] sm:max-h-[320px] lg:max-h-[450px]
               object-contain"
      >
    </div>

    <div class="pt-2 lg:pt-4">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 bg-white border border-slate-200 rounded-lg flex items-center justify-center shrink-0">
          <img
            src="images/logoVetIcon.svg"
            alt="Isotipo VETERICANO"
            width="24"
            height="24"
            class="w-6 h-6 object-contain"
          >
        </div>

        <h3
          class="text-base sm:text-lg
                 font-bold
                 text-[#170B3D]"
        >
          Panel de Administración
        </h3>
      </div>

      <p
        class="mt-2
               text-xs sm:text-sm
               leading-relaxed
               text-slate-600"
      >
        Gestiona peticiones, rescates y la coordinación de equipos veterinarios. Administra y supervisa todas las operaciones de rescate.
      </p>
    </div>

  </section>

</div>
