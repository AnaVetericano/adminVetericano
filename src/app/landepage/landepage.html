<div class="auth-canvas p-4 sm:p-8 font-['Nunito',sans-serif] selection:bg-[#4141A5] selection:text-white">
  <div class="auth-card">

    <!-- Sección Izquierda (Textos y Botones Centrados) -->
    <section
      class="bg-white
             flex flex-col
             items-center
             justify-center
             px-7 py-10 sm:px-10 sm:py-12 lg:px-10 lg:py-10"
    >
      <div class="flex flex-col items-center justify-center w-full">

        <!-- Cabecera y logo centrados -->
        <div class="text-center">
          <p
            class="text-sm sm:text-base
                   font-bold
                   tracking-[0.18em]
                   uppercase
                   text-[#170B3D]"
          >
            BIENVENIDO A
          </p>

          <h1 class="mt-3 sm:mt-4 flex justify-center">
            <img
              src="images/logo-vetericano.svg"
              alt="VETERICANO"
              width="942"
              height="527"
              class="w-48 sm:w-56 lg:w-60 h-auto object-contain"
            >
          </h1>
        </div>

        <!-- Botones Centrados -->
        <div class="w-full max-w-[300px] space-y-3 mt-8">
          <button
            type="button"
            (click)="iniciarSesion()"
            class="w-full py-3 px-4
                   rounded-lg
                   bg-[#4141A5]
                   text-white
                   text-sm
                   font-semibold
                   hover:bg-[#353583]
                   transition-colors
                   cursor-pointer"
          >
            Iniciar Sesión
          </button>

          <button
            type="button"
            (click)="registrarse()"
            class="w-full py-3 px-4
                   rounded-lg
                   bg-white
                   border border-slate-300
                   text-slate-700
                   text-sm
                   font-semibold
                   hover:bg-slate-50
                   transition-colors
                   cursor-pointer"
          >
            Registrar
          </button>
        </div>

      </div>
    </section>

    <!-- Sección Derecha (Imagen y descripción institucional) -->
    <section
      class="auth-visual-panel hidden lg:flex lg:flex-col bg-[#F4F5F7] border-l border-slate-200"
    >
      <div class="auth-brand-header">
        <div class="flex items-center gap-3">
          <div class="w-9 h-9 bg-white border border-slate-200 rounded-lg flex items-center justify-center shrink-0">
            <img
              src="images/logoVetIcon.svg"
              alt="Isotipo VETERICANO"
              width="24"
              height="24"
              class="w-6 h-6 object-contain"
            >
          </div>

          <h3 class="text-lg font-bold text-[#170B3D] leading-snug">
            Panel de gestión veterinaria
          </h3>
        </div>

        <p class="mt-3 text-sm leading-relaxed text-slate-600">
          Gestiona peticiones, rescates y la coordinación de equipos veterinarios. Administra y supervisa todas las operaciones de rescate.
        </p>
      </div>

      <div class="absolute inset-x-0 bottom-0 flex justify-center items-end pointer-events-none pb-3">
        <img
          src="images/dogcatimage.png"
          alt="Perro y gato VETERICANO"
          class="h-[345px] w-auto object-contain select-none"
        >
      </div>
    </section>

  </div>
</div>
