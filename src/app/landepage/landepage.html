<div class="h-screen w-full flex flex-col lg:flex-row overflow-hidden bg-white font-['Nunito',sans-serif] selection:bg-[#4141a5] selection:text-white">

  <!-- Sección Izquierda -->
  <section
    class="w-full lg:w-1/2
           h-1/2 lg:h-full
           bg-white
           flex flex-col
           items-center
           justify-between
           px-6 sm:px-10
           py-4 lg:py-8"
  >
    <div class="flex-1 flex flex-col items-center justify-center w-full">
      
      <div class="text-center">
        <h1
          class="text-3xl sm:text-4xl lg:text-5xl
                 font-extrabold
                 leading-none
                 text-[#170B3D]
                 tracking-wider
                 uppercase"
        >
          Bienvenido a
        </h1>

        <h2
          class="text-4xl sm:text-5xl lg:text-6xl
                 font-extrabold
                 leading-none
                 text-[#4141a5]
                 tracking-wider
                 uppercase
                 mt-2"
        >
          VETERICANO
        </h2>

        <p
          class="mt-3 sm:mt-4
                 text-base sm:text-lg
                 font-bold
                 text-gray-600"
        >
          Cuidamos a quienes no tienen voz
        </p>
      </div>

      <div class="w-full max-w-[280px] space-y-3 mt-6 lg:mt-8">
        <button
          type="button"
          (click)="iniciarSesion()"
          class="w-full py-3.5
                 rounded-2xl
                 bg-[#4141a5]
                 text-white
                 text-xs sm:text-sm
                 font-bold
                 hover:bg-[#33338b]
                 transition-all
                 shadow-md
                 uppercase
                 tracking-wider
                 active:scale-95
                 cursor-pointer"
        >
          Iniciar Sesión
        </button>

        <button
          type="button"
          (click)="registrarse()"
          class="w-full py-3.5
                 rounded-2xl
                 bg-white
                 border
                 border-gray-200
                 text-[#170B3D]
                 text-xs sm:text-sm
                 font-bold
                 hover:bg-gray-50
                 transition-all
                 shadow-xs
                 uppercase
                 tracking-wider
                 active:scale-95
                 cursor-pointer"
        >
          Registrarse
        </button>
      </div>
      
    </div>

    <div class="mt-2 shrink-0">
      <img
        src="images/logoVet.svg"
        alt="VETERICANO"
        class="w-20 sm:w-24 h-auto object-contain mx-auto"
      >
    </div>

  </section>

  <!-- Sección Derecha -->
  <section
    class="w-full lg:w-1/2
           h-1/2 lg:h-full
           bg-[#F4F5F7]
           flex flex-col
           justify-between
           px-6 sm:px-12
           py-4 lg:py-8 border-t lg:border-t-0 lg:border-l border-gray-200"
  >

    <div
      class="flex-1 w-full
             flex items-center justify-center overflow-hidden"
    >
      <img
        src="images/dogcatimage.png"
        alt="Perro y gato VETERICANO"
        class="w-auto h-full max-h-[220px] sm:max-h-[320px] lg:max-h-[450px]
               object-contain"
      >
    </div>

    <div class="pt-2 lg:pt-4">
      <div class="flex items-center gap-2.5">
        <div class="p-2 bg-[#4141a5]/10 text-[#4141a5] rounded-xl flex items-center justify-center shrink-0">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="w-5 h-5 text-[#4141a5]"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21.75 8.25c0 5.25-9.75 11.25-9.75 11.25S2.25 13.5 2.25 8.25a5.25 5.25 0 0 1 9.75-2.79 5.25 5.25 0 0 1 9.75 2.79Z"
            />
          </svg>
        </div>

        <h3
          class="text-base sm:text-lg
                 font-extrabold
                 text-[#170B3D]
                 tracking-wider
                 uppercase"
        >
          VETERICANO
        </h3>
      </div>

      <p
        class="mt-2
               text-xs sm:text-sm
               leading-relaxed
               text-gray-600"
      >
        Panel de administración para gestionar peticiones, rescates y coordinación de equipos veterinarios. Administra y supervisa todas las operaciones de rescate.
      </p>
    </div>

  </section>

</div>
