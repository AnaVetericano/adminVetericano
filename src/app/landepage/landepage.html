<div class="min-h-screen bg-[#202020] flex items-center justify-center p-4">

  <div
    class="w-full max-w-6xl min-h-[560px]
           bg-white
           flex flex-col md:flex-row
           overflow-hidden"
  >

    <!-- parte ezquierda -->
  

    <section
      class="w-full md:w-1/2
             bg-white
             flex flex-col
             justify-between
             px-10 md:px-14
             py-12"
    >

      <!-- titulo -->

      <div class="mt-4">

        <h1
          class="text-4xl md:text-5xl
                 font-extrabold
                 leading-none
                 text-[#7255a5]"
        >
          BIENVENIDO A
        </h1>

        <h2
          class="text-5xl md:text-6xl
                 font-extrabold
                 leading-none
                 text-[#7255a5]"
        >
          VETERICANO
        </h2>

        <p
          class="mt-4
                 text-xl md:text-2xl
                 font-semibold
                 text-black"
        >
          Cuidamos a quienes no tienen voz
        </p>

      </div>


      <!-- botones de direccioon -->

      <div class="w-full max-w-[220px] mx-auto md:mx-0 space-y-3">

        <button
          type="button"
          (click)="iniciarSesion()"
          class="w-full h-11
                 rounded-2xl
                 bg-[#4545aa]
                 text-white
                 text-base
                 font-medium
                 hover:bg-[#383894]
                 transition
                 duration-200
                 shadow-sm"
        >
          Iniciar Sesión
        </button>


        <button
          type="button"
          (click)="registrarse()"
          class="w-full h-11
                 rounded-2xl
                 bg-[#f7c83b]
                 text-black
                 text-base
                 font-medium
                 hover:bg-[#edbb26]
                 transition
                 duration-200
                 shadow-sm"
        >
          Registrar
        </button>

      </div>


      <!-- logo vetericano -->

      <div class="flex justify-center md:justify-start">

        <img
          src="assets/logo-vetericano.png"
          alt="VETERICANO"
          class="w-28 h-auto object-contain"
        >

      </div>

    </section>


    <!-- parte derecha  -->

    <section
      class="w-full md:w-1/2
             bg-[#f0f1ed]
             flex flex-col
             justify-between
             px-8 md:px-10
             py-8"
    >

      <!-- imagen  -->

      <div
        class="flex-1
               flex items-center justify-center"
      >

        <img
          src="assets/animales-bienvenida.png"
          alt="Perro y gato VETERICANO"
          class="max-h-[390px]
                 w-auto
                 object-contain"
        >

      </div>


      <!-- info -->

      <div class="pb-6">

        <div class="flex items-center gap-2">

          <!-- corazoncito -->

          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.8"
            stroke="currentColor"
            class="w-9 h-9
                   text-[#4545aa]"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21.75 8.25c0 5.25-9.75 11.25-9.75 11.25S2.25 13.5 2.25 8.25a5.25 5.25 0 0 1 9.75-2.79 5.25 5.25 0 0 1 9.75 2.79Z"
            />
          </svg>


          <h3
            class="text-2xl
                   font-serif
                   text-[#4545aa]"
          >
            VETERICANO
          </h3>

        </div>


        <p
          class="mt-2
                 text-sm
                 leading-tight
                 text-black
                 font-serif"
        >
          Panel de administración para gestionar peticiones,<br>
          rescates y coordinación de equipos veterinarios.<br>
          Administra y supervisa todas las operaciones de rescate.
        </p>

      </div>

    </section>

  </div>

</div>
