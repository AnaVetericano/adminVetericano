<div class="h-screen w-full flex flex-col lg:flex-row overflow-hidden bg-white">

  <!-- Sección Izquierda -->
  <section
    class="w-full lg:w-1/2
           h-1/2 lg:h-full
           bg-white
           flex flex-col
           items-center
           justify-between
           px-6 sm:px-10
           py-4 lg:py-8"
  >
    <div class="flex-1 flex flex-col items-center justify-center w-full">
      
      <div class="text-center">
        <h1
          class="text-3xl sm:text-4xl lg:text-5xl
                 font-extrabold
                 leading-none
                 text-[#7255a5]"
        >
          BIENVENIDO A
        </h1>

        <h2
          class="text-4xl sm:text-5xl lg:text-6xl
                 font-extrabold
                 leading-none
                 text-[#7255a5]
                 mt-1"
        >
          VETERICANO
        </h2>

        <p
          class="mt-2 sm:mt-3
                 text-base sm:text-xl
                 font-semibold
                 text-black"
        >
          Cuidamos a quienes no tienen voz
        </p>
      </div>

      <div class="w-full max-w-[260px] space-y-3 mt-4 lg:mt-6">
        <button
          type="button"
          (click)="iniciarSesion()"
          class="w-full h-11
                 rounded-full
                 bg-[#4545aa]
                 text-white
                 text-base sm:text-lg
                 font-medium
                 hover:bg-[#383894]
                 transition
                 duration-200
                 shadow-sm"
        >
          Iniciar Sesión
        </button>

        <button
          type="button"
          (click)="registrarse()"
          class="w-full h-11
                 rounded-full
                 bg-[#f7c83b]
                 text-black
                 text-base sm:text-lg
                 font-medium
                 hover:bg-[#edbb26]
                 transition
                 duration-200
                 shadow-sm"
        >
          Registrar
        </button>
      </div>
      
    </div>

    <div class="mt-2">
      <img
        src="images/logoVet.svg"
        alt="VETERICANO"
        class="w-20 sm:w-24 h-auto object-contain mx-auto"
      >
    </div>

  </section>

  <!-- Sección Derecha -->
  <section
    class="w-full lg:w-1/2
           h-1/2 lg:h-full
           bg-[#f0f1ed]
           flex flex-col
           justify-between
           px-6 sm:px-12
           py-4 lg:py-8"
  >

    <div
      class="flex-1 w-full
             flex items-center justify-center overflow-hidden"
    >
      <img
        src="images/dogcatimage.png"
        alt="Perro y gato VETERICANO"
        class="w-auto h-full max-h-[220px] sm:max-h-[320px] lg:max-h-[450px]
               object-contain"
      >
    </div>

    <div class="pt-2 lg:pt-4">
      <div class="flex items-center gap-2">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.8"
          stroke="currentColor"
          class="w-6 h-6 sm:w-7 sm:h-7
                 text-[#4545aa]"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M21.75 8.25c0 5.25-9.75 11.25-9.75 11.25S2.25 13.5 2.25 8.25a5.25 5.25 0 0 1 9.75-2.79 5.25 5.25 0 0 1 9.75 2.79Z"
          />
        </svg>

        <h3
          class="text-lg sm:text-xl
                 font-serif
                 text-[#4545aa]"
        >
          VETERICANO
        </h3>
      </div>

      <p
        class="mt-1
               text-xs sm:text-sm
               leading-snug
               text-black
               font-serif"
      >
        Panel de administración para gestionar peticiones, rescates y coordinación de equipos veterinarios. Administra y supervisa todas las operaciones de rescate.
      </p>
    </div>

  </section>

</div>
