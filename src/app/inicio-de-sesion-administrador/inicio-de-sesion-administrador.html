<div class="min-h-screen bg-[#1B1947] flex items-center justify-center p-4">
  <div class="w-full max-w-5xl bg-[#ECECF6] rounded-2xl overflow-hidden shadow-xl flex min-h-[600px]">

    <!-- PANEL IZQUIERDO -->
    <div class="hidden md:flex flex-col w-[45%] bg-[#E1E4DD] relative overflow-hidden p-10">
      <div class="flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-[#1B1947]" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M4.318 6.318a4.5 4.5 0 016.364 0L12 7.636l1.318-1.318
                   a4.5 4.5 0 016.364 6.364L12 21.364 4.318 12.682
                   a4.5 4.5 0 010-6.364z"/>
        </svg>
        <span class="text-xl font-bold tracking-widest text-[#1B1947]">VETERICANO</span>  
      </div>

      <p class="mt-6 text-sm text-[#1B1947] leading-relaxed z-10">
        Panel de administración para gestionar peticiones,<br/>
        rescates y coordinación de equipos veterinarios.<br/>
        Administra y supervisa todas las operaciones de rescate
      </p>

      <!-- CABRA DEL LOGIN -->
      <div class="absolute inset-0 flex items-center justify-center mt-32">
        <img src="/images/cabraDelLogin.svg"
             alt="Animal VETERICANO"
             class="object-contain w-72 h-auto select-none pointer-events-none" />
      </div>
    </div>

    <!-- PANEL DERECHO -->
    <div class="flex-1 bg-white flex flex-col items-center justify-center px-6 py-8 md:px-10 md:py-10">

      <!-- LOGO VETERICANO -->
      <div class="flex flex-col items-center mb-4">
        <img src="/images/logoVet.svg"
             alt="Logo VETERICANO"
             class="w-20 h-20 object-contain mb-3" />
      </div>

      <h2 class="text-3xl font-extrabold text-[#1B1947] mb-1">Bienvenido</h2>
      <p class="text-sm font-semibold text-slate-600 mb-6">Inicia sesión para continuar</p>

      <!-- Formulario ajustado con el método de ngModel -->
      <form (ngSubmit)="login()" class="w-full max-w-sm space-y-4" novalidate>

        <!-- Email / Usuario -->
        <div class="flex items-center gap-3 bg-white border border-slate-300 rounded-full px-5 py-3 focus-within:border-indigo-500 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-slate-400 shrink-0" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25H4.5
                     a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0
                     0019.5 4.5H4.5a2.25 2.25 0 00-2.25 2.25m19.5 0
                     l-9.75 6.75L2.25 6.75"/>
          </svg>
          <input type="text" placeholder="Usuario" [(ngModel)]="usuario.username" name="username"
                 class="flex-1 bg-transparent text-sm text-slate-800 placeholder-slate-400 focus:outline-none" />
        </div>

        <!-- Contraseña -->
        <div class="flex items-center gap-3 bg-white border border-slate-300 rounded-full px-5 py-3 focus-within:border-indigo-500 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-slate-400 shrink-0" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75
                     m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75
                     a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0
                     00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
          </svg>
          <input type="password" placeholder="Contraseña" [(ngModel)]="usuario.password" name="password"
                 class="flex-1 bg-transparent text-sm text-slate-800 placeholder-slate-400 focus:outline-none" />
        </div>

        <!-- ¿Olvidaste tu contraseña? -->
        <div class="text-right">
          <a href="#" class="text-xs text-[#1B1947] font-medium hover:underline">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Botón -->
        <button type="submit"
                class="w-full bg-[#1B1947] hover:bg-[#2a2870] text-white font-bold py-3 rounded-full text-sm uppercase shadow transition-colors">
          Iniciar Sesión
        </button>

        <p class="text-center text-sm text-slate-600 mt-4">
          ¿No tienes cuenta?
          <a routerLink="/register" class="text-[#1B1947] font-bold hover:underline ml-1">Registrate</a>
        </p>

      </form>
    </div>
  </div>
</div>
