<div class="min-h-screen bg-[#1B1947] flex items-center justify-center p-4">
  <div class="w-full max-w-5xl bg-[#ECECF6] rounded-2xl overflow-hidden shadow-xl flex min-h-[600px]">

    <!-- PANEL IZQUIERDO (Color de fondo actualizado a #E1E4DD) -->
    <div class="hidden md:flex flex-col w-[45%] bg-[#E1E4DD] relative overflow-hidden p-10">
      <div class="flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-[#1B1947]" fill="none"
             viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M4.318 6.318a4.5 4.5 0 016.364 0L12 7.636l1.318-1.318
                   a4.5 4.5 0 016.364 6.364L12 21.364 4.318 12.682
                   a4.5 4.5 0 010-6.364z"/>
        </svg>
        <span class="text-xl font-bold tracking-widest text-[#1B1947]">VETERICANO</span>
      </div>

      <p class="mt-6 text-sm text-[#1B1947] leading-relaxed z-10">
        Panel de administración para gestionar peticiones,<br/>
        rescates y coordinación de equipos veterinarios.<br/>
        Administra y supervisa todas las operaciones de rescate
      </p>

      <!-- CABRA DEL LOGIN -->
      <div class="absolute inset-0 flex items-center justify-center mt-32">
        <img src="/images/cabraDelLogin.svg"
             alt="Animal VETERICANO"
             class="object-contain w-72 h-auto select-none pointer-events-none" />
      </div>
    </div>

    <!-- PANEL DERECHO -->
    <div class="flex-1 bg-white flex flex-col items-center justify-center px-10 py-10">

      <!-- LOGO VETERICANO -->
      <div class="flex flex-col items-center mb-4">
        <img src="/images/logoVet.svg"
             alt="Logo VETERICANO"
             class="w-20 h-20 object-contain mb-3" />
      </div>

      <h2 class="text-3xl font-extrabold text-[#1B1947] mb-1">Bienvenido</h2>
      <p class="text-sm font-semibold text-slate-600 mb-6">Inicia sesión para continuar</p>

      <!-- Formulario -->
      <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="w-full max-w-sm space-y-4" novalidate>

        <!-- Email -->
        <div class="flex items-center gap-3 bg-white border border-slate-300 rounded-full px-5 py-3 focus-within:border-indigo-500 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-slate-400 shrink-0" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25H4.5
                     a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0
                     0019.5 4.5H4.5a2.25 2.25 0 00-2.25 2.25m19.5 0
                     l-9.75 6.75L2.25 6.75"/>
          </svg>
          <input type="text" placeholder="Email o telefono" formControlName="emailOrPhone"
                 class="flex-1 bg-transparent text-sm text-slate-800 placeholder-slate-400 focus:outline-none" />
        </div>

        <!-- Contraseña -->
        <div class="flex items-center gap-3 bg-white border border-slate-300 rounded-full px-5 py-3 focus-within:border-indigo-500 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-slate-400 shrink-0" fill="none"
               viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75
                     m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75
                     a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0
                     00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
          </svg>
          <input type="password" placeholder="Contraseña" formControlName="password"
                 class="flex-1 bg-transparent text-sm text-slate-800 placeholder-slate-400 focus:outline-none" />
        </div>

        <!-- ¿Olvidaste tu contraseña? -->
        <div class="text-right">
          <a href="#" class="text-xs text-[#1B1947] font-medium hover:underline">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Botón -->
        <button type="submit"
                class="w-full bg-[#1B1947] hover:bg-[#2a2870] text-white font-bold py-3 rounded-full text-sm uppercase shadow transition-colors">
          Iniciar Sesión
        </button>

        <!-- Divisor -->
        <div class="flex items-center gap-3">
          <hr class="flex-1 border-slate-300"/>
          <span class="text-xs text-slate-400">O inicia con</span>
          <hr class="flex-1 border-slate-300"/>
        </div>

        <!-- Sociales -->
        <div class="flex justify-center gap-5">
          <button type="button" class="w-11 h-11 rounded-full border border-slate-200 bg-white hover:shadow-md transition flex items-center justify-center">
            <svg class="w-5 h-5" viewBox="0 0 48 48">
              <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
              <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
              <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
              <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
            </svg>
          </button>
          <button type="button" class="w-11 h-11 rounded-full border border-slate-200 bg-white hover:shadow-md transition flex items-center justify-center">
            <svg class="w-5 h-5" viewBox="0 0 48 48">
              <path fill="#1877F2" d="M48 24C48 10.745 37.255 0 24 0S0 10.745 0 24c0 11.979 8.776 21.908 20.25 23.708V30.938h-6.094V24H20.25v-5.344c0-6.011 3.579-9.332 9.066-9.332 2.625 0 5.372.469 5.372.469v5.906h-3.026c-2.979 0-3.912 1.849-3.912 3.745V24h6.656l-1.064 6.938H27.75v16.77C39.224 45.908 48 35.979 48 24z"/>
            </svg>
          </button>
          <button type="button" class="w-11 h-11 rounded-full border border-slate-200 bg-white hover:shadow-md transition flex items-center justify-center">
            <svg class="w-5 h-5" viewBox="0 0 48 48">
              <path fill="#000" d="M35.5 25.7c-.1-4.9 4-7.3 4.2-7.4-2.3-3.3-5.8-3.8-7.1-3.8-3-.3-5.9 1.8-7.4 1.8-1.5 0-3.9-1.7-6.4-1.7-3.3.1-6.4 1.9-8.1 4.9-3.4 6-.9 14.9 2.5 19.7 1.6 2.4 3.6 5 6.2 4.9 2.5-.1 3.4-1.6 6.4-1.6s3.8 1.6 6.4 1.5c2.7 0 4.4-2.4 6-4.8 1.9-2.8 2.7-5.5 2.7-5.6-.1 0-5.3-2.1-5.4-8zm-5.1-14.8c1.4-1.7 2.3-4 2-6.4-2 .1-4.3 1.3-5.7 3-1.3 1.5-2.4 3.9-2 6.2 2.1.2 4.3-1.1 5.7-2.8z"/>
            </svg>
          </button>
        </div>

        <p class="text-center text-sm text-slate-600">
          ¿No tienes cuenta?
          <a routerLink="/register" class="text-[#1B1947] font-bold hover:underline ml-1">Registrate</a>
        </p>

      </form>
    </div>

  </div>
</div>
