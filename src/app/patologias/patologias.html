<div class="h-[100dvh] w-full bg-gray-50 flex flex-col text-slate-800 antialiased selection:bg-indigo-500 selection:text-white overflow-hidden relative">

    <!-- BARRA SUPERIOR -->
    <header class="bg-[#1B1947] h-16 shrink-0 flex items-center px-4 sm:px-6 shadow-md w-full lg:pl-20 transition-all duration-300">
        <h1 class="text-lg sm:text-xl font-extrabold tracking-widest text-white uppercase">
            Patologías
        </h1>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 flex flex-col overflow-hidden lg:pl-20 transition-all duration-300">

        <!-- ACCIONES SUPERIORES (BUSCADOR Y BOTÓN CREAR) -->
        <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3 mb-4 shrink-0">

            <!-- BARRA DE BÚSQUEDA Y FILTROS -->
            <div class="flex items-center bg-white rounded-2xl border border-gray-200 w-full sm:w-2/3 h-12 shadow-sm hover:border-indigo-300 focus-within:border-indigo-500 focus-within:ring-2 focus-within:ring-indigo-100 transition-all duration-300">
                <div class="flex items-center px-4 flex-1 gap-3 min-w-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-gray-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    <input
                        type="text"
                        placeholder="Buscar patología..."
                        class="w-full outline-none text-sm text-gray-700 placeholder-gray-400 bg-transparent truncate">
                </div>
                <div class="h-5 w-px bg-gray-200 shrink-0"></div>
                <button class="px-4 sm:px-5 text-xs sm:text-sm font-semibold text-gray-600 hover:text-indigo-600 transition-colors flex items-center gap-2 shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707v3.172a1 1 0 01-.553.894l-4 2A1 1 0 017 20.172v-9.172a1 1 0 00-.293-.707L.293 7.293A1 1 0 010 6.586V4z"/>
                    </svg>
                    Filtros
                </button>
            </div>

            <!-- BOTÓN CREAR PATOLOGÍA -->
            <button
                type="button"
                (click)="abrirModalCrear()"
                class="flex items-center justify-center gap-2 bg-[#1B1947] hover:bg-[#2a2870] text-white font-bold px-5 py-3 rounded-2xl shadow-lg hover:shadow-indigo-500/20 active:scale-95 transition-all duration-300 text-xs sm:text-sm tracking-wider uppercase whitespace-nowrap">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/>
                </svg>
                Crear Patología
            </button>

        </div>

        <!-- TABLA DE DATOS -->
        <div class="bg-white rounded-2xl shadow-md border border-gray-100 flex-1 overflow-hidden flex flex-col mb-4">
            <div class="overflow-x-auto overflow-y-auto flex-1">
                <table class="w-full text-left border-collapse min-w-[500px]">
                    <thead class="bg-gray-50/90 border-b border-gray-100 sticky top-0 z-10">
                        <tr>
                            <th class="px-6 py-3.5 text-xs font-bold tracking-wider text-gray-500 uppercase">Nombre</th>
                            <th class="px-6 py-3.5 text-xs font-bold tracking-wider text-gray-500 uppercase">Descripción</th>
                            <th class="px-6 py-3.5 text-xs font-bold tracking-wider text-gray-500 uppercase text-center">Opciones</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 text-sm">
                        <!-- Mensaje de carga -->
                        <tr *ngIf="cargando">
                            <td colspan="3" class="px-6 py-4 text-center text-gray-400 font-medium">Cargando patologías...</td>
                        </tr>

                        <!-- Mensaje si no hay registros -->
                        <tr *ngIf="!cargando && patologias.length === 0">
                            <td colspan="3" class="px-6 py-4 text-center text-gray-400 font-medium">No hay patologías registradas.</td>
                        </tr>

                        <!-- Filas dinámicas respetando 100% tu diseño -->
                        <tr *ngFor="let p of patologias" class="hover:bg-indigo-50/30 transition-colors group">
                            <td class="px-6 py-3.5 font-bold text-gray-900">{{ p.nombre }}</td>
                            <td class="px-6 py-3.5 text-gray-600 max-w-xs sm:max-w-md truncate">{{ p.descripcion }}</td>
                            <td class="px-6 py-3.5">
                                <div class="flex justify-center gap-2">
                                    <button class="bg-gray-100 hover:bg-[#F1C63C] hover:text-white text-gray-600 p-2 rounded-xl transition-all duration-200 shadow-xs" title="Editar">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                                    </button>
                                    <button class="bg-gray-100 hover:bg-red-600 hover:text-white text-gray-600 p-2 rounded-xl transition-all duration-200 shadow-xs" title="Eliminar">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- MODAL DE CREAR PATOLOGÍA (RESPONSIVO Y CON SCROLL AISLADO) -->
    @if (modalAbierto) {
        <div class="fixed inset-0 bg-black/60 backdrop-blur-xs flex items-center justify-center p-3 sm:p-6 z-50 overflow-hidden">
            <div class="bg-white rounded-3xl shadow-2xl w-full max-w-lg p-5 sm:p-8 border border-gray-100 relative flex flex-col max-h-[90vh]">
                
                <!-- Botón X para cerrar -->
                <button (click)="cerrarModal()" class="absolute top-5 right-5 sm:top-6 sm:right-6 text-gray-400 hover:text-gray-700 font-bold text-lg p-1 z-10">
                    ✕
                </button>

                <h2 class="text-xl sm:text-2xl font-extrabold text-[#1B1947] mb-4 uppercase tracking-wider pr-8 shrink-0">
                    Crear Patologías
                </h2>

                <!-- Contenedor con scroll propio solo para los inputs -->
                <div class="space-y-3 sm:space-y-4 overflow-y-auto flex-1 pr-1 py-1">
                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Nombre de la patología</label>
                        <input type="text" [(ngModel)]="patologia.nombre" placeholder="Nombre de la patología" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 sm:py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50/50">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Descripción</label>
                        <input type="text" [(ngModel)]="patologia.descripcion" placeholder="Descripción" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 sm:py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50/50">
                    </div>  

                    <div>
                        <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Estado</label>
                        <input type="text" [(ngModel)]="patologia.activo" placeholder="Estado" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 sm:py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50/50">
                    </div>
                </div>

                <!-- Botones del Modal (Fijos abajo) -->
                <div class="flex items-center justify-end gap-3 mt-4 pt-3 sm:pt-4 border-t border-gray-100 shrink-0">
                    <button (click)="cerrarModal()" class="px-4 sm:px-5 py-2.5 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold transition text-xs uppercase tracking-wider">
                        Cancelar
                    </button>
                    <button (click)="guardarPatologia()" class="px-5 sm:px-6 py-2.5 rounded-xl bg-[#1B1947] hover:bg-[#2a2870] text-white font-bold transition text-xs uppercase tracking-wider shadow-md">
                        Crear
                    </button>
                </div>

            </div>
        </div>
    }

</div>
