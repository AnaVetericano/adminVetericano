<div class="h-[100dvh] w-full bg-[#F4F5F7] flex flex-col text-slate-800 antialiased font-['Nunito',sans-serif] selection:bg-[#4141a5] selection:text-white overflow-hidden relative">

  <!-- ENCABEZADO CON ICONO Y SUBTÍTULO -->
  <header class="bg-white shrink-0 py-4 px-4 sm:px-8 shadow-xs border-b border-gray-100 w-full lg:pl-20 transition-all duration-300">
    <div class="flex items-center gap-3.5 max-w-7xl mx-auto">
      <div class="p-3 bg-[#4141a5]/10 text-[#4141a5] rounded-2xl flex items-center justify-center shrink-0 shadow-xs">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 sm:w-7 sm:h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h4m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
      </div>
      <div>
        <h1 class="text-lg sm:text-2xl font-extrabold text-[#170B3D] tracking-wider uppercase">
          Reportar Petición de Maltrato Animal
        </h1>
        <p class="text-xs sm:text-sm text-gray-500 font-medium">
          Panel administrativo para el registro y control de peticiones en una sola vista
        </p>
      </div>
    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL CON SCROLL -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 flex flex-col overflow-y-auto lg:pl-20 transition-all duration-300">

    <div class="w-full bg-white rounded-3xl shadow-xs overflow-hidden border border-gray-100 p-5 sm:p-8 mb-6">

      <!-- Formulario -->
      <form
        [formGroup]="reporteForm"
        (ngSubmit)="enviarReporte()"
        class="grid grid-cols-1 md:grid-cols-2 gap-8">

        <!-- COLUMNA IZQUIERDA -->
        <div class="space-y-6">

          <!-- 1. Tipo de Petición -->
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-2">
              1. ¿Qué tipo de petición quieres reportar?
            </label>

            <div class="grid grid-cols-2 gap-3">

              <label
                class="flex items-center p-3 border rounded-2xl cursor-pointer transition-all active:scale-95"
                [ngClass]="
                  reporteForm.get('tipoPeticion')?.value === 'herido'
                    ? 'border-[#4141a5] bg-[#4141a5]/10 text-[#4141a5] font-bold shadow-xs'
                    : 'border-gray-200 bg-gray-50/50 hover:border-[#4141a5]/40 text-gray-700'
                ">
                <input
                  type="radio"
                  formControlName="tipoPeticion"
                  value="herido"
                  class="sr-only">
                <span class="text-xl mr-2.5">🩹</span>
                <span class="text-xs uppercase tracking-wider">
                  Animal Herido
                </span>
              </label>

              <!-- Maltrato -->
              <label
                class="flex items-center p-3 border rounded-2xl cursor-pointer transition-all active:scale-95"
                [ngClass]="
                  reporteForm.get('tipoPeticion')?.value === 'maltrato'
                    ? 'border-[#4141a5] bg-[#4141a5]/10 text-[#4141a5] font-bold shadow-xs'
                    : 'border-gray-200 bg-gray-50/50 hover:border-[#4141a5]/40 text-gray-700'
                ">
                <input
                  type="radio"
                  formControlName="tipoPeticion"
                  value="maltrato"
                  class="sr-only">
                <span class="text-xl mr-2.5">⚠️</span>
                <span class="text-xs uppercase tracking-wider">
                  Maltrato Animal
                </span>
              </label>

              <!-- Condición de Calle -->
              <label
                class="flex items-center p-3 border rounded-2xl cursor-pointer transition-all active:scale-95"
                [ngClass]="
                  reporteForm.get('tipoPeticion')?.value === 'calle'
                    ? 'border-[#4141a5] bg-[#4141a5]/10 text-[#4141a5] font-bold shadow-xs'
                    : 'border-gray-200 bg-gray-50/50 hover:border-[#4141a5]/40 text-gray-700'
                ">
                <input
                  type="radio"
                  formControlName="tipoPeticion"
                  value="calle"
                  class="sr-only">
                <span class="text-xl mr-2.5">🐾</span>
                <span class="text-xs uppercase tracking-wider">
                  Condición de Calle
                </span>
              </label>

              <!-- Otro -->
              <label
                class="flex items-center p-3 border rounded-2xl cursor-pointer transition-all active:scale-95"
                [ngClass]="
                  reporteForm.get('tipoPeticion')?.value === 'otro'
                    ? 'border-[#4141a5] bg-[#4141a5]/10 text-[#4141a5] font-bold shadow-xs'
                    : 'border-gray-200 bg-gray-50/50 hover:border-[#4141a5]/40 text-gray-700'
                ">
                <input
                  type="radio"
                  formControlName="tipoPeticion"
                  value="otro"
                  class="sr-only">
                <span class="text-xl mr-2.5">➕</span>
                <span class="text-xs uppercase tracking-wider">
                  Otro
                </span>
              </label>

            </div>

            <!-- Especificar Otro -->
            <div
              *ngIf="reporteForm.get('tipoPeticion')?.value === 'otro'"
              class="mt-3">
              <input
                type="text"
                formControlName="otroEspecificacion"
                placeholder="Especifique el tipo de caso..."
                class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#4141a5]/30 focus:border-[#4141a5] bg-gray-50/50 text-[#170B3D]">
            </div>

          </div>

          <!-- 3. Descripción -->
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">
              3. Cuéntanos más sobre lo que está sucediendo
            </label>

            <textarea
              formControlName="descripcion"
              rows="4"
              class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-[#4141a5]/30 focus:border-[#4141a5] bg-gray-50/50 resize-none leading-relaxed text-[#170B3D]"
              placeholder="Describe lo que está pasando, el estado del animal, etc."></textarea>
          </div>

          <!-- 4. Evidencia -->
          <div>
            <label class="block text-xs font-bold text-gray-600 uppercase mb-1">
              4. Agregar fotos o videos
            </label>

            <label
              class="border-2 border-dashed border-gray-300 hover:border-[#4141a5] rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer hover:bg-[#4141a5]/5 transition-all group">
              <span class="text-2xl mb-1 group-hover:scale-110 transition-transform">📷</span>
              <span class="text-xs text-[#4141a5] font-bold uppercase tracking-wider">
                Subir archivo
              </span>
              <span class="text-[11px] text-gray-400 mt-0.5">Formatos de imagen o video</span>
              <input
                type="file"
                (change)="onFileSelected($event)"
                accept="image/*,video/*"
                class="hidden">
            </label>

            <!-- Nombre del archivo -->
            <p
              *ngIf="archivoSeleccionado"
              class="text-xs text-[#170B3D] font-bold mt-2 flex items-center gap-1.5">
              <span>📎</span> {{ archivoSeleccionado.name }}
            </p>
          </div>

        </div>

        <!-- ============================= -->
        <!-- COLUMNA DERECHA -->
        <!-- ============================= -->
        <div class="space-y-6 flex flex-col justify-between">

          <div class="space-y-4">

            <!-- 2. Ubicación -->
            <label class="block text-xs font-bold text-gray-600 uppercase">
              2. ¿Dónde ocurrió la petición?
            </label>

            <!-- Campo ubicación -->
            <!-- Campo ubicación -->
<div class="flex gap-2">

  <input
    type="text"
    formControlName="ubicacion"
    placeholder="Ej: El Centro, La Esmeralda, Popayán..."
    (keyup.enter)="buscarUbicacion()"
    class="flex-1 border border-gray-200 rounded-xl px-4 py-2.5 text-sm
           focus:outline-none focus:ring-2 focus:ring-[#4141A5]
           bg-white text-[#170B3D]">

  <button
    type="button"
    (click)="buscarUbicacion()"
    class="bg-[#4141A5] text-white px-4 py-2.5 rounded-xl
           hover:bg-[#170B3D] transition font-semibold text-sm">

    🔍 Buscar
  </button>

</div>
<!-- MAPA -->
<div class="w-full h-64 bg-gray-100 rounded-2xl overflow-hidden border border-gray-200 shadow-inner">

  <!-- Google Maps -->
  <iframe
    *ngIf="mapaUrl"
    [src]="mapaUrl"
    width="100%"
    height="100%"
    style="border:0;"
    loading="lazy"
    allowfullscreen
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>

  <!-- Mensaje cuando todavía no hay ubicación -->
  <div
    *ngIf="!mapaUrl"
    class="w-full h-full flex flex-col items-center justify-center text-gray-500 text-xs font-medium gap-1">

    <span class="font-bold text-[#170B3D]">
      Presiona "Usar mi ubicación"
    </span>

    <span class="text-gray-400">
      para mostrar el mapa
    </span>

  </div>

</div>

            <!-- ESTADO UBICACIÓN -->
            <div
              *ngIf="mensajeUbicacion"
              class="p-3 rounded-xl text-xs font-semibold"
              [ngClass]="
                ubicacionObtenida
                  ? 'bg-emerald-50 text-emerald-700 border border-emerald-200'
                  : 'bg-amber-50 text-amber-700 border border-amber-200'
              ">
              {{ mensajeUbicacion }}
            </div>

            <!-- BOTÓN GPS -->
            <button
              type="button"
              (click)="usarMiUbicacion()"
              [disabled]="cargandoUbicacion"
              class="w-full py-3 bg-gray-100 hover:bg-[#4141a5]/10 hover:text-[#4141a5] border border-gray-200 disabled:opacity-50 text-[#170B3D] font-bold rounded-xl text-xs uppercase tracking-wider transition active:scale-95 cursor-pointer">
              <span *ngIf="!cargandoUbicacion">
                📍 Usar mi ubicación actual
              </span>
              <span *ngIf="cargandoUbicacion">
                ⏳ Obteniendo ubicación...
              </span>
            </button>

            <!-- BOTONES GOOGLE MAPS -->
          

            <!-- COORDENADAS -->
       

          </div>

          <!-- ENVIAR -->
          <button
            type="submit"
            [disabled]="reporteForm.invalid || !ubicacionObtenida"
            class="w-full py-3.5 bg-[#4141a5] hover:bg-[#33338b] disabled:opacity-50 text-white font-bold rounded-2xl shadow-md transition-all text-xs sm:text-sm tracking-wider uppercase whitespace-nowrap active:scale-95 cursor-pointer">
            Enviar Petición de Maltrato Completa
          </button>

        </div>

      </form>

    </div>

  </main>

</div>
