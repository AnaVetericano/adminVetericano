<div class="min-h-screen bg-[#E3E4DF] p-8 flex justify-center items-center font-sans">

  <!-- Contenedor del Panel -->

  <div class="w-full max-w-5xl bg-white rounded-2xl shadow-xl overflow-hidden border border-[#E3E4DF]">

<!-- Cabecera -->
<div class="bg-[#170B3D] text-white px-8 py-6">
  <h1 class="text-2xl font-bold">
    Reportar Petición de Maltrato Animal
  </h1>

  <p class="text-xs text-[#E3E4DF] mt-1">
    Panel administrativo para el registro y control de peticiones en una sola vista.
  </p>
</div>

<!-- Formulario -->
<form
  [formGroup]="reporteForm"
  (ngSubmit)="enviarReporte()"
  class="p-8 grid grid-cols-1 md:grid-cols-2 gap-8"
>


  <div class="space-y-6">

    <!-- 1. Tipo de Petición -->
    <div>

      <label class="block text-sm font-bold text-[#170B3D] mb-3">
        1. ¿Qué tipo de petición quieres reportar?
      </label>

      <div class="grid grid-cols-2 gap-3">

        <label
          class="flex items-center p-3 border-2 rounded-xl cursor-pointer transition"
          [ngClass]="
            reporteForm.get('tipoPeticion')?.value === 'herido'
              ? 'border-[#4141A5] bg-[#4141A5]/5'
              : 'border-[#E3E4DF]'
          "
        >

          <input
            type="radio"
            formControlName="tipoPeticion"
            value="herido"
            class="sr-only"
          >

          <span class="text-lg mr-2">
            🩹
          </span>

          <span class="text-xs font-semibold text-[#170B3D]">
            Animal Herido
          </span>

        </label>


        <!-- Maltrato -->
        <label
          class="flex items-center p-3 border-2 rounded-xl cursor-pointer transition"
          [ngClass]="
            reporteForm.get('tipoPeticion')?.value === 'maltrato'
              ? 'border-[#4141A5] bg-[#4141A5]/5'
              : 'border-[#E3E4DF]'
          "
        >

          <input
            type="radio"
            formControlName="tipoPeticion"
            value="maltrato"
            class="sr-only"
          >

          <span class="text-lg mr-2">
            ⚠️
          </span>

          <span class="text-xs font-semibold text-[#170B3D]">
            Maltrato Animal
          </span>

        </label>


        <!-- Condición de Calle -->
        <label
          class="flex items-center p-3 border-2 rounded-xl cursor-pointer transition"
          [ngClass]="
            reporteForm.get('tipoPeticion')?.value === 'calle'
              ? 'border-[#4141A5] bg-[#4141A5]/5'
              : 'border-[#E3E4DF]'
          "
        >

          <input
            type="radio"
            formControlName="tipoPeticion"
            value="calle"
            class="sr-only"
          >

          <span class="text-lg mr-2">
            🐾
          </span>

          <span class="text-xs font-semibold text-[#170B3D]">
            Condición de Calle
          </span>

        </label>


        <!-- Otro -->
        <label
          class="flex items-center p-3 border-2 rounded-xl cursor-pointer transition"
          [ngClass]="
            reporteForm.get('tipoPeticion')?.value === 'otro'
              ? 'border-[#4141A5] bg-[#4141A5]/5'
              : 'border-[#E3E4DF]'
          "
        >

          <input
            type="radio"
            formControlName="tipoPeticion"
            value="otro"
            class="sr-only"
          >

          <span class="text-lg mr-2">
            ➕
          </span>

          <span class="text-xs font-semibold text-[#170B3D]">
            Otro
          </span>

        </label>

      </div>


      <!-- Especificar Otro -->
      <div
        *ngIf="reporteForm.get('tipoPeticion')?.value === 'otro'"
        class="mt-3"
      >

        <input
          type="text"
          formControlName="otroEspecificacion"
          placeholder="Especifique el tipo de caso..."
          class="w-full p-2.5 border border-[#4141A5] rounded-xl text-xs focus:outline-none bg-[#E3E4DF]/20 text-[#170B3D]"
        >

      </div>

    </div>


    <!-- 3. Descripción -->
    <div>

      <label class="block text-sm font-bold text-[#170B3D] mb-2">
        3. Cuéntanos más sobre lo que está sucediendo
      </label>

      <textarea
        formControlName="descripcion"
        rows="4"
        class="w-full p-3 border border-[#E3E4DF] rounded-xl focus:outline-none focus:border-[#4141A5] text-xs text-[#170B3D]"
        placeholder="Describe lo que está pasando, el estado del animal, etc."
      ></textarea>

    </div>


    <!-- 4. Evidencia -->
    <div>

      <label class="block text-sm font-bold text-[#170B3D] mb-2">
        4. Agregar fotos o videos
      </label>

      <label
        class="border-2 border-dashed border-[#4141A5] rounded-xl p-4 flex flex-col items-center justify-center cursor-pointer hover:bg-[#4141A5]/5 transition"
      >

        <span class="text-xl mb-1">
          📷
        </span>

        <span class="text-xs text-[#4141A5] font-semibold">
          Subir archivo
        </span>

        <input
          type="file"
          (change)="onFileSelected($event)"
          accept="image/*,video/*"
          class="hidden"
        >

      </label>


      <!-- Nombre del archivo -->
      <p
        *ngIf="archivoSeleccionado"
        class="text-xs text-[#170B3D] mt-2"
      >
        📎 {{ archivoSeleccionado.name }}
      </p>

    </div>

  </div>


  <!-- ============================= -->
  <!-- COLUMNA DERECHA -->
  <!-- ============================= -->

  <div class="space-y-6 flex flex-col justify-between">

    <div class="space-y-4">

      <!-- 2. Ubicación -->
      <label class="block text-sm font-bold text-[#170B3D]">
        2. ¿Dónde ocurrió la petición?
      </label>


      <!-- Campo ubicación -->
      <input
        type="text"
        formControlName="ubicacion"
        placeholder="Usa el botón para obtener tu ubicación..."
        readonly
        class="w-full p-3 border border-[#E3E4DF] rounded-xl focus:outline-none focus:border-[#4141A5] text-xs text-[#170B3D] bg-gray-50"
      >

      <div
        class="w-full h-64 bg-[#E3E4DF] rounded-xl overflow-hidden border border-[#E3E4DF]"
      >

        <!-- Google Maps -->
        <iframe
          *ngIf="mapaUrl"
          [src]="mapaUrl"
          width="100%"
          height="100%"
          style="border:0;"
          loading="lazy"
          allowfullscreen
          referrerpolicy="no-referrer-when-downgrade"
        >
        </iframe>


        <!-- Sin ubicación -->
        <div
          *ngIf="!mapaUrl"
          class="w-full h-full flex flex-col items-center justify-center text-[#170B3D] text-xs font-medium"
        >


          <span>
            Presiona "Usar mi ubicación"
          </span>

          <span class="text-gray-500 mt-1">
            para mostrar Google Maps
          </span>

        </div>

      </div>


      <!-- ============================= -->
      <!-- ESTADO UBICACIÓN -->
      <!-- ============================= -->

      <div
        *ngIf="mensajeUbicacion"
        class="p-3 rounded-xl text-xs"
        [ngClass]="
          ubicacionObtenida
            ? 'bg-green-50 text-green-700 border border-green-200'
            : 'bg-yellow-50 text-yellow-700 border border-yellow-200'
        "
      >
        {{ mensajeUbicacion }}
      </div>


      <!-- ============================= -->
      <!-- BOTÓN GPS -->
      <!-- ============================= -->

      <button
        type="button"
        (click)="usarMiUbicacion()"
        [disabled]="cargandoUbicacion"
        class="w-full py-3 bg-[#E3E4DF] hover:bg-[#d8dad5] disabled:opacity-50 text-[#170B3D] font-semibold rounded-xl text-xs transition"
      >

        <span *ngIf="!cargandoUbicacion">
          📍 Usar mi ubicación actual
        </span>

        <span *ngIf="cargandoUbicacion">
          ⏳ Obteniendo ubicación...
        </span>

      </button>


      <!-- ============================= -->
      <!-- BOTONES GOOGLE MAPS -->
      <!-- ============================= -->

      <div
        *ngIf="ubicacionObtenida"
        class="grid grid-cols-2 gap-3"
      >

        <!-- Abrir Google Maps -->
        <button
          type="button"
          (click)="abrirGoogleMaps()"
          class="py-2.5 bg-[#4141A5] hover:bg-[#333385] text-white font-semibold rounded-xl text-xs transition"
        >
          🗺️ Abrir Maps
        </button>


        <!-- Compartir -->
        <button
          type="button"
          (click)="compartirUbicacion()"
          class="py-2.5 bg-[#170B3D] hover:bg-[#24115a] text-white font-semibold rounded-xl text-xs transition"
        >
          📤 Compartir
        </button>

      </div>


      <!-- ============================= -->
      <!-- COORDENADAS -->
      <!-- ============================= -->

      <div
        *ngIf="ubicacionObtenida"
        class="bg-gray-50 border border-gray-200 rounded-xl p-3"
      >

        <p class="text-xs font-bold text-[#170B3D] mb-1">
          Coordenadas
        </p>

        <p class="text-xs text-gray-600">
          Latitud: {{ latitud }}
        </p>

        <p class="text-xs text-gray-600">
          Longitud: {{ longitud }}
        </p>

      </div>

    </div>


    <!-- ============================= -->
    <!-- ENVIAR -->
    <!-- ============================= -->

    <button
      type="submit"
      [disabled]="reporteForm.invalid || !ubicacionObtenida"
      class="w-full py-4 bg-[#4141A5] hover:bg-[#333385] disabled:opacity-50 text-white font-bold rounded-xl shadow-lg transition duration-200 text-sm"
    >
      Enviar Petición de Maltrato Completa
    </button>

  </div>

</form>

  </div>

</div>
