<div class="h-[100dvh] w-full bg-[#F4F5F7] flex flex-col text-slate-800 antialiased font-['Nunito',sans-serif] selection:bg-[#4141a5] selection:text-white overflow-hidden relative">

  <!-- ENCABEZADO CON ICONO Y SUBTÍTULO -->
  <header class="bg-white shrink-0 py-4 px-4 sm:px-8 shadow-xs border-b border-gray-100 w-full lg:pl-20 transition-all duration-300">
    <div class="flex items-center gap-3.5 max-w-7xl mx-auto">
      <div class="p-3 bg-[#4141a5]/10 text-[#4141a5] rounded-2xl flex items-center justify-center shrink-0 shadow-xs">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 sm:w-7 sm:h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
        </svg>
      </div>
      <div>
        <h1 class="text-lg sm:text-2xl font-extrabold text-[#170B3D] tracking-wider uppercase">
          Panel de Estadísticas
        </h1>
        <p class="text-xs sm:text-sm text-gray-500 font-medium">
          Visualización y análisis de métricas registradas en el sistema
        </p>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-3 sm:p-6 flex flex-col overflow-y-auto lg:pl-20 transition-all duration-300">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <div class="bg-white p-6 rounded-3xl shadow-xs border border-gray-100 flex flex-col items-center justify-center w-full min-h-[320px]">
        <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-4 self-start">Distribución de Usuarios</h3>
        <div class="w-full flex-1 flex items-center justify-center">
          <canvas #GraficUsers></canvas>
        </div>
      </div>

      <div *ngIf="false" class="bg-white p-6 rounded-3xl shadow-xs border border-gray-100 flex flex-col items-center justify-center w-full min-h-[320px]">
        <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-4 self-start">Roles de Usuarios</h3>
        <div class="w-full flex-1 flex items-center justify-center">
          <canvas #GraficUsersRol></canvas>
        </div>
      </div>

    </div>
  </main>

</div>
