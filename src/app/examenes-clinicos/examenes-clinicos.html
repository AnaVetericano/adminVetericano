<div class="h-[100dvh] w-full bg-gray-50 flex flex-col text-slate-800 antialiased selection:bg-indigo-500 selection:text-white overflow-hidden">

    <!-- BARRA SUPERIOR DE TÍTULO -->
    <header class="bg-[#1B1947] h-16 shrink-0 flex items-center px-6 shadow-md w-full lg:pl-20 transition-all duration-300">
        <h1 class="text-xl font-extrabold tracking-widest text-white uppercase">
            Exámenes Clínicos
        </h1>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 flex flex-col overflow-hidden lg:pl-20 transition-all duration-300">

        <!-- ACCIONES SUPERIORES -->
        <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-3 mb-4 shrink-0">
            <div class="flex items-center bg-white rounded-2xl border border-gray-200 w-full md:w-2/3 h-12 shadow-sm">
                <div class="flex items-center px-4 flex-1 gap-3">
                    <input type="text" placeholder="Buscar examen clínico..." class="w-full outline-none text-sm text-gray-700 bg-transparent">
                </div>
            </div>

            <button class="flex items-center justify-center gap-2 bg-[#1B1947] hover:bg-[#2a2870] text-white font-bold px-5 py-3 rounded-2xl shadow-lg text-xs sm:text-sm tracking-wider uppercase whitespace-nowrap" (click)="irACrearExamen()">
                Crear Exámenes Clínicos
            </button>
        </div>

        <!-- TABLA DE DATOS -->
        <div class="bg-white rounded-2xl shadow-md border border-gray-100 flex-1 overflow-hidden flex flex-col mb-4">
            <div class="overflow-y-auto flex-1">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-gray-50/90 border-b border-gray-100 sticky top-0 z-10">
                        <tr>
                            <th class="px-6 py-3.5 text-xs font-bold tracking-wider text-gray-500 uppercase">Nombre</th>
                            <th class="px-6 py-3.5 text-xs font-bold tracking-wider text-gray-500 uppercase">Descripción</th>
                            <th class="px-6 py-3.5 text-xs font-bold tracking-wider text-gray-500 uppercase text-center">Tipo</th>
                            <th class="px-6 py-3.5 text-xs font-bold tracking-wider text-gray-500 uppercase text-center">Opciones</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100 text-sm">
                        <!-- FILA RECORRIendo SUPABASE -->
                        <tr *ngFor="let item of listaCatalogo" class="hover:bg-indigo-50/30 transition-colors group">
                            <td class="px-6 py-3.5 font-bold text-gray-900">{{ item.nombre_tipo }}</td>
                            <td class="px-6 py-3.5 text-gray-600">Procedimiento del sistema</td>
                            <td class="px-6 py-3.5 text-center text-gray-600">Clínico</td>
                            <td class="px-6 py-3.5">
                                <div class="flex justify-center gap-2">
                                    <button (click)="eliminarExamen(item.id_procedimiento_catalogo)" class="bg-gray-100 hover:bg-red-600 hover:text-white text-gray-600 p-2 rounded-xl transition-all">🗑️</button>
                                    <button (click)="ediex()" class="bg-gray-100 hover:bg-[#F1C63C] hover:text-white text-gray-600 p-2 rounded-xl transition-all">✏️</button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</div>
