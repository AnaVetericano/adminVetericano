<div class="bg-gray-50 text-gray-800 min-h-screen flex flex-col font-sans">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-gray-200 px-8 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-50 p-2.5 rounded-xl text-indigo-700">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-bold text-indigo-950 tracking-tight">ADOPCIONES DE MASCOTAS</h1>
                <p class="text-xs text-gray-500">Crea y administra las mascotas en adopción</p>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-6 py-8 flex-grow w-full">
        
        <!-- Controls Bar: Search & Action Button -->
        <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-8">
            <!-- Search Input -->
            <div class="relative w-full md:w-1/2">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </span>
                <input type="text" [(ngModel)]="searchTerm" placeholder="Buscar por nombre, raza, estado o descripción..." 
                    class="w-full pl-12 pr-4 py-3 bg-white border border-gray-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:border-transparent text-sm">
            </div>

            <!-- New Adoption Button -->
            <button (click)="openModal()" class="w-full md:w-auto bg-indigo-900 hover:bg-indigo-800 text-white font-semibold px-6 py-3 rounded-xl shadow-md transition duration-200 flex items-center justify-center space-x-2 text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                <span>NUEVA ADOPCIÓN</span>
            </button>
        </div>

        <!-- Pets Grid Container -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div *ngFor="let pet of filteredPets; let i = index" class="bg-white border border-gray-200 rounded-2xl shadow-sm overflow-hidden flex flex-col justify-between hover:shadow-md transition duration-200">
                <div class="p-4 pb-2">
                    
                    <!-- Fila Superior con Fecha e insignia de Estado -->
                    <div class="flex justify-between items-center mb-2 text-xs">
                        <span class="text-gray-400 font-medium flex items-center gap-1">
                            📅 {{ pet.fecha }}
                        </span>
                        <span class="px-2.5 py-0.5 rounded-full font-semibold"
                            [ngClass]="{
                                'bg-emerald-50 text-emerald-700 border border-emerald-200': pet.estado === 'Disponible',
                                'bg-amber-50 text-amber-700 border border-amber-200': pet.estado === 'En Proceso',
                                'bg-purple-50 text-purple-700 border border-purple-200': pet.estado === 'Adoptado'
                            }">
                            {{ pet.estado }}
                        </span>
                    </div>

                    <!-- Imagen de la Mascota -->
                    <div class="h-44 w-full rounded-xl overflow-hidden mb-3 bg-gray-100">
                        <img [src]="pet.imagen" [alt]="pet.nombre" class="w-full h-full object-cover">
                    </div>

                    <h2 class="text-xl font-bold text-indigo-950 text-center mb-2">{{ pet.nombre }}</h2>
                    
                    <div class="space-y-1 text-xs">
                        <p><strong class="text-gray-700">Raza:</strong> {{ pet.raza }}</p>
                        <p class="text-gray-600 line-clamp-3"><strong class="text-gray-700">Descripción:</strong> {{ pet.descripcion }}</p>
                    </div>
                </div>

                <!-- Botones de Acción inferior -->
                <div class="px-4 py-3 bg-gray-50/50 border-t border-gray-100 flex justify-between items-center text-xs font-semibold mt-3">
                    <button (click)="openModal(i)" class="text-indigo-700 hover:text-indigo-900 flex items-center space-x-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                        </svg>
                        <span>Editar</span>
                    </button>
                    <button (click)="deletePet(i)" class="text-rose-600 hover:text-rose-800 flex items-center space-x-1">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                        <span>Eliminar</span>
                    </button>
                </div>
            </div>

            <!-- Mensaje si no hay resultados -->
            <div *ngIf="filteredPets.length === 0" class="col-span-full text-center py-12 text-gray-500">
                No se encontraron mascotas registradas.
            </div>
        </div>

    </main>

    <!-- Modal for Creating/Editing Pet -->
    <div *ngIf="isModalOpen" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl transform transition-all">
            <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="text-lg font-bold text-indigo-950">{{ isEditMode ? 'Editar Mascota' : 'Subir Nueva Mascota' }}</h3>
                <button (click)="closeModal()" class="text-gray-400 hover:text-gray-600">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <form (ngSubmit)="savePet()" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Nombre de la Mascota</label>
                    <input type="text" [(ngModel)]="currentPet.nombre" name="nombre" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600" placeholder="Ej. Max">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Raza</label>
                    <input type="text" [(ngModel)]="currentPet.raza" name="raza" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600" placeholder="Ej. Labrador">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Estado</label>
                        <select [(ngModel)]="currentPet.estado" name="estado" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-600">
                            <option value="Disponible">Disponible</option>
                            <option value="En Proceso">En Proceso</option>
                            <option value="Adoptado">Adoptado</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Fecha de Registro</label>
                        <input type="text" [(ngModel)]="currentPet.fecha" name="fecha" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600" placeholder="Ej. Sep 25, 2026">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">URL de la Imagen</label>
                    <input type="url" [(ngModel)]="currentPet.imagen" name="imagen" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600" placeholder="https://images.unsplash.com/photo-...">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Descripción</label>
                    <textarea [(ngModel)]="currentPet.descripcion" name="descripcion" rows="3" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-600" placeholder="Escribe detalles sobre su carácter, vacunas..."></textarea>
                </div>
                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" (click)="closeModal()" class="px-4 py-2 border border-gray-300 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-50">Cancelar</button>
                    <button type="submit" class="px-5 py-2 bg-indigo-900 text-white rounded-lg text-sm font-semibold hover:bg-indigo-800 shadow">Guardar Mascota</button>
                </div>
            </form>
        </div>
    </div>

</div>
