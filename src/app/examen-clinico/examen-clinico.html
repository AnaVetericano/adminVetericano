<div class="h-[100dvh] w-full bg-gray-50 flex flex-col text-slate-800 antialiased selection:bg-indigo-500 selection:text-white overflow-hidden relative">

    <header class="bg-[#1B1947] h-16 shrink-0 flex items-center px-4 sm:px-6 shadow-md w-full lg:pl-20 transition-all duration-300">
        <h1 class="text-lg sm:text-xl font-extrabold tracking-widest text-white uppercase">
            Crear Examen Clínico
        </h1>
    </header>

    <main class="flex-1 max-w-3xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center overflow-y-auto lg:pl-20">
        <div class="bg-white rounded-3xl shadow-xl p-6 sm:p-8 border border-gray-100 flex flex-col gap-5">
            
            <div class="border-b border-gray-100 pb-4">
                <h2 class="text-xl font-extrabold text-[#1B1947] uppercase tracking-wider">Nuevo Examen Clínico</h2>
                <p class="text-xs text-gray-500 mt-1">Completa los datos del procedimiento para agregarlo al sistema.</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Nombre del examen</label>
                    <input type="text" [(ngModel)]="examen.nombre" placeholder="Ej. Ecografía" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50/50">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Tipo de examen</label>
                    <input type="text" [(ngModel)]="examen.tipo" placeholder="Ej. Clínico" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50/50">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Descripción</label>
                    <input type="text" [(ngModel)]="examen.descripcion" placeholder="Descripción del examen" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50/50">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Observaciones</label>
                    <input type="text" [(ngModel)]="examen.observaciones" placeholder="Observaciones adicionales" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50/50">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 uppercase mb-1">Estado</label>
                    <input type="text" [(ngModel)]="examen.estado" placeholder="Estado" class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50/50">
                </div>
            </div>

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100">
                <button (click)="cerrarModal()" class="px-5 py-3 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold transition text-xs uppercase tracking-wider">
                    Cancelar
                </button>
                <button (click)="guardarExamen()" class="px-6 py-3 rounded-xl bg-[#1B1947] hover:bg-[#2a2870] text-white font-bold transition text-xs uppercase tracking-wider shadow-md">
                    Guardar Examen
                </button>
            </div>

        </div>
    </main>

</div>
